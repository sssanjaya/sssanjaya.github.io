<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">When ultrathink can raise a turn to xhigh</title>
  <desc id="d">Decision flow from the Claude Code docs. The word raises the turn to xhigh only when it is typed in the interactive terminal prompt, outside quotes, brackets, paths, or commands, in a prompt that does not start with a slash; the model is Opus 5.5, Sonnet 5.5, Haiku 5.5, or Fable 5.1 through Anthropic's API; and no CLAUDE_CODE_EFFORT_LEVEL, maxEffortLevel, or organization cap holds effort below xhigh. Otherwise it only adds an in-context instruction.</desc>
  <style>
    .t{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:15px}
    .m{font-family:ui-sans-serif,system-ui,sans-serif;fill:#8b98a8;font-size:14px}
    .c{font-family:ui-monospace,monospace;fill:#e6ebf2;font-size:14px}
    .no{font-family:ui-sans-serif,system-ui,sans-serif;fill:#ff6b6b;font-size:14px}
    .yes{font-family:ui-sans-serif,system-ui,sans-serif;fill:#5fd38d;font-size:14px}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6cb6ff"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="900" height="560" fill="#0d1218"/>

  <rect x="40" y="20" width="460" height="50" rx="8" fill="none" stroke="#6cb6ff" stroke-width="2"/>
  <text x="270" y="51" class="t" text-anchor="middle">Prompt contains <tspan class="c">ultrathink</tspan></text>
  <line x1="270" y1="70" x2="270" y2="98" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="100" width="460" height="66" rx="8" fill="none" stroke="#2a3441" stroke-width="2"/>
  <text x="60" y="127" class="t">1. Typed in the interactive terminal prompt?</text>
  <text x="60" y="151" class="m">Not a <tspan class="c">claude -p</tspan> run</text>
  <line x1="270" y1="166" x2="270" y2="194" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="186" class="yes">yes</text>

  <rect x="40" y="196" width="460" height="66" rx="8" fill="none" stroke="#2a3441" stroke-width="2"/>
  <text x="60" y="223" class="t">2. A bare word in a normal prompt?</text>
  <text x="60" y="247" class="m">Not in quotes, brackets, a path, a command, or a /prompt</text>
  <line x1="270" y1="262" x2="270" y2="290" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="282" class="yes">yes</text>

  <rect x="40" y="292" width="460" height="66" rx="8" fill="none" stroke="#2a3441" stroke-width="2"/>
  <text x="60" y="319" class="t">3. A 5.5 model or Fable 5.1, on Anthropic's API?</text>
  <text x="60" y="343" class="m">Not on Amazon Bedrock, per the docs</text>
  <line x1="270" y1="358" x2="270" y2="386" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="378" class="yes">yes</text>

  <rect x="40" y="388" width="460" height="66" rx="8" fill="none" stroke="#2a3441" stroke-width="2"/>
  <text x="60" y="415" class="t">4. Nothing caps effort below xhigh?</text>
  <text x="60" y="439" class="c">CLAUDE_CODE_EFFORT_LEVEL, maxEffortLevel</text>
  <line x1="270" y1="454" x2="270" y2="482" stroke="#6cb6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="280" y="474" class="yes">yes</text>

  <rect x="40" y="484" width="460" height="56" rx="8" fill="#5fd38d" fill-opacity="0.12" stroke="#5fd38d" stroke-width="2"/>
  <text x="270" y="509" class="t" text-anchor="middle">Rainbow word. This turn runs at <tspan class="c">xhigh</tspan></text>
  <text x="270" y="530" class="m" text-anchor="middle">plus the in-context instruction</text>

  <line x1="500" y1="133" x2="590" y2="133" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="500" y1="229" x2="590" y2="229" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="500" y1="325" x2="590" y2="325" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="500" y1="421" x2="590" y2="421" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="590" y1="133" x2="590" y2="421" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="590" y1="277" x2="628" y2="277" stroke="#ff6b6b" stroke-width="2" marker-end="url(#r)"/>
  <text x="520" y="122" class="no">no</text>

  <rect x="630" y="222" width="250" height="110" rx="8" fill="#ff6b6b" fill-opacity="0.10" stroke="#ff6b6b" stroke-width="2"/>
  <text x="755" y="252" class="t" text-anchor="middle">Plain word</text>
  <text x="755" y="278" class="m" text-anchor="middle">In-context instruction only</text>
  <text x="755" y="302" class="m" text-anchor="middle">Effort stays at the</text>
  <text x="755" y="321" class="m" text-anchor="middle">session level</text>
</svg>
