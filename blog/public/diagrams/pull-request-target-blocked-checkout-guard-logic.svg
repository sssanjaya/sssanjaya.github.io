<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="t d">
<title id="t">How actions/checkout v7 decides to refuse a fork checkout</title>
<desc id="d">The guard passes if allow-unsafe-pr-checkout is true, if repository and ref are left at their defaults, if the event is not pull_request_target or a workflow_run from a pull request, or if the pull request head repository is not a fork. Otherwise, if the repository input is the fork, the ref matches refs/pull/N/head or merge, or the commit is the pull request head or merge SHA, the step fails with Refusing to check out fork pull request code.</desc>
<style>.h{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:17px;font-weight:600}.t{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:15px}.m{font-family:ui-sans-serif,system-ui,sans-serif;fill:#8b98a8;font-size:14px}.c{font-family:ui-monospace,monospace;fill:#e6ebf2;font-size:14px}.g{font-family:ui-sans-serif,system-ui,sans-serif;fill:#5fd38d;font-size:14px}.r{font-family:ui-sans-serif,system-ui,sans-serif;fill:#ff6b6b;font-size:14px}</style>
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5fd38d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker></defs>
<rect width="960" height="630" fill="#0d1218"/>
<text class="h" x="30" y="38">The checkout guard, read from unsafe-pr-checkout-helper.ts</text>
<text class="m" x="30" y="62">Checks run top to bottom. Any green exit lets the checkout continue.</text>
<rect x="720" y="100" width="210" height="394" rx="8" fill="#0f1f17" stroke="#5fd38d" stroke-width="2"/>
<text class="h" x="736" y="132">Guard passes</text>
<text class="m" x="736" y="156">checkout fetches</text>
<text class="m" x="736" y="178">the requested code</text>
<rect x="30" y="100" width="600" height="58" rx="8" fill="#111a24" stroke="#f5b14c" stroke-width="2"/>
<text class="t" x="46" y="135">allow-unsafe-pr-checkout: true?</text>
<line x1="632" y1="129.0" x2="718" y2="129.0" stroke="#5fd38d" stroke-width="2" marker-end="url(#ag)"/>
<text class="g" x="644" y="121.0">yes</text>
<text class="m" x="700" y="121.0" text-anchor="end">lab D</text>
<line x1="90" y1="160" x2="90" y2="182" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
<text class="m" x="102" y="176.0">no</text>
<rect x="30" y="184" width="600" height="58" rx="8" fill="#111a24" stroke="#f5b14c" stroke-width="2"/>
<text class="t" x="46" y="219">repository and ref left at defaults?</text>
<line x1="632" y1="213.0" x2="718" y2="213.0" stroke="#5fd38d" stroke-width="2" marker-end="url(#ag)"/>
<text class="g" x="644" y="205.0">yes</text>
<line x1="90" y1="244" x2="90" y2="266" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
<text class="m" x="102" y="260.0">no</text>
<rect x="30" y="268" width="600" height="58" rx="8" fill="#111a24" stroke="#f5b14c" stroke-width="2"/>
<text class="t" x="46" y="303">event is pull_request_target, or workflow_run from a PR?</text>
<line x1="632" y1="297.0" x2="718" y2="297.0" stroke="#5fd38d" stroke-width="2" marker-end="url(#ag)"/>
<text class="g" x="644" y="289.0">no</text>
<text class="m" x="700" y="289.0" text-anchor="end">lab E</text>
<line x1="90" y1="328" x2="90" y2="350" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
<text class="m" x="102" y="344.0">yes</text>
<rect x="30" y="352" width="600" height="58" rx="8" fill="#111a24" stroke="#f5b14c" stroke-width="2"/>
<text class="t" x="46" y="387">PR head repository is a fork?</text>
<line x1="632" y1="381.0" x2="718" y2="381.0" stroke="#5fd38d" stroke-width="2" marker-end="url(#ag)"/>
<text class="g" x="644" y="373.0">no</text>
<line x1="90" y1="412" x2="90" y2="434" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
<text class="m" x="102" y="428.0">yes</text>
<rect x="30" y="436" width="600" height="58" rx="8" fill="#111a24" stroke="#f5b14c" stroke-width="2"/>
<text class="t" x="46" y="471">repository is the fork, ref is refs/pull/N/..., or commit is the PR SHA?</text>
<line x1="632" y1="465.0" x2="718" y2="465.0" stroke="#5fd38d" stroke-width="2" marker-end="url(#ag)"/>
<text class="g" x="644" y="457.0">no</text>
<line x1="90" y1="496" x2="90" y2="532" stroke="#ff6b6b" stroke-width="2" marker-end="url(#ar)"/>
<text class="r" x="102" y="512.0">yes</text>
<rect x="30" y="534" width="900" height="62" rx="8" fill="#1f1416" stroke="#ff6b6b" stroke-width="2"/>
<text class="c" x="46" y="560">::error::Refusing to check out fork pull request code</text>
<text class="m" x="46" y="582">step exits 1 before any fetch. Lab cases A (ref: head.sha) and B (repository: the fork) end here.</text>
</svg>
