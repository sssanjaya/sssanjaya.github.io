<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">Claude apps gateway: first-match policies versus policy_mode layered</title>
<desc id="d">A developer in IdP groups eng and contractors. With the default first-match evaluation, the gateway selects only the first matching policy, contractors, and merges it onto the match-all base; the eng policy is skipped. With managed.policy_mode set to layered in Claude Code 2.1.316, every matching policy applies: contractors is merged over eng, which is merged over the base. Below, pooled_budget adds one monthly budget that a group's members share, on top of each member's own limit.</desc>
<style>.t{fill:#e6ebf2;font-size:16px}.m{fill:#8b98a8;font-size:15px}.h{fill:#e6ebf2;font-size:19px;font-weight:700}.c{fill:#e6ebf2;font-family:ui-monospace, monospace;font-size:15px}
@media (prefers-reduced-motion: no-preference){.p{animation:pl 6s ease-in-out infinite}@keyframes pl{0%,20%{opacity:.25}35%,80%{opacity:1}100%{opacity:.25}}}</style>
<rect width="900" height="500" fill="#0d1218"/>
<text x="30" y="38" class="h">Developer token: groups [eng, contractors]</text>
<text x="30" y="80" class="t" font-weight="700">Default: first match wins</text>
<rect x="30" y="96" width="390" height="50" rx="6" fill="#0f2a1c" stroke="#5fd38d" stroke-width="2"/>
<text x="46" y="127" class="c">1  match: { groups: [contractors] }</text>
<rect x="30" y="156" width="390" height="50" rx="6" fill="#121a23" stroke="#2a3441" stroke-dasharray="6 5"/>
<text x="46" y="187" class="c" fill-opacity=".55">2  match: { groups: [eng] }</text>
<text x="300" y="187" class="m">skipped</text>
<rect x="30" y="216" width="390" height="50" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="46" y="247" class="c">3  match: {}   base layer</text>
<text x="30" y="296" class="m">Result: policy 1 merged onto the base</text>
<text x="480" y="80" class="t" font-weight="700">policy_mode: layered (2.1.316)</text>
<rect x="480" y="96" width="390" height="50" rx="6" fill="#0f2a1c" stroke="#5fd38d" stroke-width="2"/>
<text x="496" y="127" class="c">1  match: { groups: [contractors] }</text>
<rect class="p" x="480" y="156" width="390" height="50" rx="6" fill="#0f2a1c" stroke="#5fd38d" stroke-width="2"/>
<text x="496" y="187" class="c">2  match: { groups: [eng] }</text>
<rect x="480" y="216" width="390" height="50" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="496" y="247" class="c">3  match: {}   base layer</text>
<text x="480" y="296" class="m">Result: 1 over 2 over the base</text>
<line x1="30" y1="325" x2="870" y2="325" stroke="#2a3441"/>
<text x="30" y="358" class="t" font-weight="700">Spend: pooled_budget (2.1.316)</text>
<rect x="30" y="374" width="250" height="50" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="46" y="405" class="t">Member A: own limit</text>
<rect x="300" y="374" width="250" height="50" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="316" y="405" class="t">Member B: own limit</text>
<rect x="30" y="434" width="520" height="44" rx="6" fill="#2a2111" stroke="#f5b14c"/>
<text x="46" y="462" class="t">One monthly budget the whole group shares</text>
<text x="580" y="405" class="m">The pool applies on top</text>
<text x="580" y="428" class="m">of each member's own</text>
<text x="580" y="451" class="m">limit, not instead of it</text>
</svg>
