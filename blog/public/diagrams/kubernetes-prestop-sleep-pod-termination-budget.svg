<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">One grace period covers the preStop hook and the app shutdown</title>
<desc id="d">Three timelines on a 0 to 65 second axis. Row 1: grace 45 s, preStop sleep 10 s, then SIGTERM at 10 s leaves 35 s for the app; SIGKILL at 45 s. Row 2, the Kubernetes docs example: grace 60 s, hook takes 55 s, app needs 10 s after SIGTERM, so it is killed at 60 s, 5 s short. Row 3: preStop sleep 50 s with grace 45 s is rejected by the API server at apply time.</desc>
<style>.l{fill:#e6ebf2;font-size:15px}.m{fill:#8b98a8;font-size:14px}.c{font-family:ui-monospace, monospace;font-size:14px}</style>
<rect width="960" height="470" fill="#0d1218"/>
<line x1="250" y1="400" x2="920" y2="400" stroke="#2a3441" stroke-width="2"/>
<line x1="250.0" y1="400" x2="250.0" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="250.0" y1="40" x2="250.0" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="250.0" y="426" text-anchor="middle" class="m">0</text>
<line x1="301.5" y1="400" x2="301.5" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="301.5" y1="40" x2="301.5" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="301.5" y="426" text-anchor="middle" class="m">5</text>
<line x1="353.1" y1="400" x2="353.1" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="353.1" y1="40" x2="353.1" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="353.1" y="426" text-anchor="middle" class="m">10</text>
<line x1="404.6" y1="400" x2="404.6" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="404.6" y1="40" x2="404.6" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="404.6" y="426" text-anchor="middle" class="m">15</text>
<line x1="456.2" y1="400" x2="456.2" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="456.2" y1="40" x2="456.2" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="456.2" y="426" text-anchor="middle" class="m">20</text>
<line x1="507.7" y1="400" x2="507.7" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="507.7" y1="40" x2="507.7" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="507.7" y="426" text-anchor="middle" class="m">25</text>
<line x1="559.2" y1="400" x2="559.2" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="559.2" y1="40" x2="559.2" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="559.2" y="426" text-anchor="middle" class="m">30</text>
<line x1="610.8" y1="400" x2="610.8" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="610.8" y1="40" x2="610.8" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="610.8" y="426" text-anchor="middle" class="m">35</text>
<line x1="662.3" y1="400" x2="662.3" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="662.3" y1="40" x2="662.3" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="662.3" y="426" text-anchor="middle" class="m">40</text>
<line x1="713.8" y1="400" x2="713.8" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="713.8" y1="40" x2="713.8" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="713.8" y="426" text-anchor="middle" class="m">45</text>
<line x1="765.4" y1="400" x2="765.4" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="765.4" y1="40" x2="765.4" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="765.4" y="426" text-anchor="middle" class="m">50</text>
<line x1="816.9" y1="400" x2="816.9" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="816.9" y1="40" x2="816.9" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="816.9" y="426" text-anchor="middle" class="m">55</text>
<line x1="868.5" y1="400" x2="868.5" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="868.5" y1="40" x2="868.5" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="868.5" y="426" text-anchor="middle" class="m">60</text>
<line x1="920.0" y1="400" x2="920.0" y2="406" stroke="#2a3441" stroke-width="2"/>
<line x1="920.0" y1="40" x2="920.0" y2="400" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 6"/>
<text x="920.0" y="426" text-anchor="middle" class="m">65</text>
<text x="585.0" y="452" text-anchor="middle" class="m">seconds after the pod is deleted</text>
<text x="24" y="88" class="l">grace 45 s</text><text x="24" y="108" class="c" fill="#8b98a8">sleep: 10</text>
<rect x="250.0" y="70" width="103.1" height="40" rx="4" fill="#14263a" stroke="#6cb6ff"/>
<text x="301.5" y="96" text-anchor="middle" class="l">sleep</text>
<rect x="353.1" y="70" width="360.8" height="40" rx="4" fill="#132619" stroke="#5fd38d"/>
<text x="533.5" y="96" text-anchor="middle" class="l">35 s to drain and exit</text>
<line x1="353.1" y1="60" x2="353.1" y2="120" stroke="#f5b14c" stroke-width="3"/>
<text x="353.1" y="54" text-anchor="middle" class="c" fill="#f5b14c">SIGTERM</text>
<line x1="713.8" y1="60" x2="713.8" y2="120" stroke="#ff6b6b" stroke-width="3"/>
<text x="713.8" y="54" text-anchor="middle" class="c" fill="#ff6b6b">SIGKILL</text>
<text x="24" y="218" class="l">grace 60 s</text><text x="24" y="238" class="m">hook 55 s, app 10 s</text>
<rect x="250.0" y="200" width="566.9" height="40" rx="4" fill="#14263a" stroke="#6cb6ff"/>
<text x="533.5" y="226" text-anchor="middle" class="l">preStop hook runs 55 s</text>
<rect x="816.9" y="200" width="51.5" height="40" rx="4" fill="#132619" stroke="#5fd38d"/>
<rect x="868.5" y="200" width="51.5" height="40" rx="4" fill="#2a1a1a" stroke="#ff6b6b"/>
<line x1="816.9" y1="190" x2="816.9" y2="250" stroke="#f5b14c" stroke-width="3"/>
<text x="812.9" y="184" text-anchor="end" class="c" fill="#f5b14c">SIGTERM</text>
<line x1="868.5" y1="190" x2="868.5" y2="250" stroke="#ff6b6b" stroke-width="3"/>
<text x="872.5" y="184" text-anchor="start" class="c" fill="#ff6b6b">SIGKILL</text>
<text x="894.2" y="268" text-anchor="middle" class="m" style="fill:#ff6b6b">5 s short</text>
<text x="24" y="328" class="l">grace 45 s</text><text x="24" y="348" class="c" fill="#8b98a8">sleep: 50</text>
<rect x="250" y="310" width="670" height="40" rx="4" fill="#2a1a1a" stroke="#ff6b6b" stroke-dasharray="6 4"/>
<text x="266" y="336" class="l">rejected at apply: sleep must be less than terminationGracePeriodSeconds</text>
</svg>