<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">testmetest arming chain: from hijacked account to payload run</title>
<desc id="d">Five steps left to right and down. A hijacked GitHub account pushes an arming commit that copies old messages and author dates and adds skip-checks:true. The commit adds five AI assistant and IDE hook files plus a 12.9 to 13.7 MB .github/init.js that code search does not index. A developer opens the repo in Claude Code, Gemini, Cursor or VS Code, or a pipeline runs claude -p. The hook runs node .github/init.js. A native loader sleeps in CI runners, containers and sandboxes, and elsewhere decrypts and runs a payload that steals credentials and spreads through npm.</desc>
<style>
  .box { fill: #121a23; stroke: #2a3441; stroke-width: 2; }
  .bad { stroke: #ff6b6b; }
  .warn { stroke: #f5b14c; }
  .h { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 17px; font-weight: 700; fill: #e6ebf2; }
  .t { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #8b98a8; }
  .c { font-family: ui-monospace, monospace; font-size: 14px; fill: #e6ebf2; }
  .n { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0d1218; }
  .flow { fill: none; stroke: #6cb6ff; stroke-width: 2.5; }
  @media (prefers-reduced-motion: no-preference) {
    .flow { stroke-dasharray: 8 6; animation: march 6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -140; } }
  }
</style>
<rect width="960" height="600" fill="#0d1218"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6cb6ff"/></marker>
</defs>
<text x="30" y="40" class="h" font-size="22">How a quiet commit becomes a credential stealer</text>

<!-- 1 -->
<rect x="30" y="70" width="220" height="110" rx="8" class="box bad"/>
<circle cx="52" cy="92" r="13" fill="#ff6b6b"/><text x="52" y="97" class="n" text-anchor="middle">1</text>
<text x="74" y="98" class="h">Hijacked account</text>
<text x="46" y="128" class="t">Real owner, old repos.</text>
<text x="46" y="150" class="t">Hijacks seen from July 2026</text>

<!-- 2 -->
<rect x="360" y="70" width="240" height="110" rx="8" class="box bad"/>
<circle cx="382" cy="92" r="13" fill="#ff6b6b"/><text x="382" y="97" class="n" text-anchor="middle">2</text>
<text x="404" y="98" class="h">Arming commit</text>
<text x="376" y="128" class="t">Copied message and author date</text>
<text x="376" y="152" class="c">skip-checks:true</text>

<!-- 3 files -->
<rect x="700" y="60" width="230" height="250" rx="8" class="box warn"/>
<circle cx="722" cy="82" r="13" fill="#f5b14c"/><text x="722" y="87" class="n" text-anchor="middle">3</text>
<text x="744" y="88" class="h">Files it adds</text>
<text x="716" y="120" class="c">.claude/settings.json</text>
<text x="716" y="144" class="c">.gemini/settings.json</text>
<text x="716" y="168" class="c">.cursor/mcp.json</text>
<text x="716" y="192" class="c">.cursor/rules/setup.mdc</text>
<text x="716" y="216" class="c">.vscode/tasks.json</text>
<line x1="716" y1="232" x2="914" y2="232" stroke="#2a3441" stroke-width="1.5"/>
<text x="716" y="258" class="c" fill="#ff6b6b">.github/init.js</text>
<text x="716" y="282" class="t">12.9 to 13.7 MB, not indexed</text>

<!-- 4 trigger -->
<rect x="360" y="300" width="240" height="140" rx="8" class="box"/>
<circle cx="382" cy="322" r="13" fill="#6cb6ff"/><text x="382" y="327" class="n" text-anchor="middle">4</text>
<text x="404" y="328" class="h">Someone opens it</text>
<text x="376" y="358" class="t">Claude Code session start,</text>
<text x="376" y="380" class="t">Gemini, Cursor, VS Code</text>
<text x="376" y="402" class="t">folder open, or CI running</text>
<text x="376" y="424" class="c">claude -p</text>

<!-- 5 hook -->
<rect x="30" y="300" width="220" height="140" rx="8" class="box bad"/>
<circle cx="52" cy="322" r="13" fill="#ff6b6b"/><text x="52" y="327" class="n" text-anchor="middle">5</text>
<text x="74" y="328" class="h">Hook fires</text>
<text x="46" y="362" class="c">node .github/init.js</text>
<text x="46" y="384" class="c">|| bun .github/init.js</text>
<text x="46" y="416" class="t">Decodes the next stage</text>

<!-- 6 loader -->
<rect x="360" y="470" width="570" height="100" rx="8" class="box bad"/>
<circle cx="382" cy="492" r="13" fill="#ff6b6b"/><text x="382" y="497" class="n" text-anchor="middle">6</text>
<text x="404" y="498" class="h">Native loader</text>
<text x="376" y="528" class="t">In a CI runner, container or sandbox: stays asleep, scanners see nothing.</text>
<text x="376" y="552" class="t">Elsewhere: decrypts and runs the payload: credential theft, npm spread.</text>

<path d="M250 120 H352" class="flow" marker-end="url(#a)"/>
<path d="M600 120 H692" class="flow" marker-end="url(#a)"/>
<path d="M815 310 V370 H608" class="flow" marker-end="url(#a)"/>
<path d="M360 370 H258" class="flow" marker-end="url(#a)"/>
<path d="M140 440 V520 H352" class="flow" marker-end="url(#a)"/>
</svg>
