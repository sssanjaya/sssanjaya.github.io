<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">Which effort level a Claude Code subagent runs at</title>
<desc id="d">Claude Code checks four sources in order and uses the first one set. First the CLAUDE_CODE_EFFORT_LEVEL environment variable. Then the effort parameter Claude passes on that invocation. Then the effort field in the subagent's definition. Then, new in 2.1.316, CLAUDE_CODE_SUBAGENT_EFFORT. If none is set, the subagent inherits the session's effort level.</desc>
<style>.t{fill:#e6ebf2;font-size:16px}.m{fill:#8b98a8;font-size:15px}.h{fill:#e6ebf2;font-size:20px;font-weight:700}.c{fill:#e6ebf2;font-family:ui-monospace, monospace;font-size:15px}
@media (prefers-reduced-motion: no-preference){.k{animation:dn 7s linear infinite}@keyframes dn{0%{transform:translateY(0)}80%,100%{transform:translateY(300px)}}}</style>
<rect width="900" height="440" fill="#0d1218"/>
<text x="30" y="38" class="h">Subagent effort: first source that is set wins</text>
<line x1="60" y1="70" x2="60" y2="390" stroke="#6cb6ff" stroke-width="2.5"/>
<circle class="k" cx="60" cy="80" r="7" fill="#6cb6ff"/>
<rect x="90" y="62" width="470" height="56" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="106" y="86" class="c">CLAUDE_CODE_EFFORT_LEVEL</text><text x="106" y="108" class="m">environment variable, beats everything</text>
<rect x="90" y="132" width="470" height="56" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="106" y="156" class="c">effort</text><text x="160" y="156" class="t">parameter on this invocation</text><text x="106" y="178" class="m">when Claude asks for a level (non-fork, v2.1.292+)</text>
<rect x="90" y="202" width="470" height="56" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="106" y="226" class="c">effort:</text><text x="170" y="226" class="t">in the subagent's frontmatter</text><text x="106" y="248" class="m">per-agent default</text>
<rect x="90" y="272" width="470" height="56" rx="6" fill="#0f2a1c" stroke="#5fd38d" stroke-width="2"/>
<text x="106" y="296" class="c">CLAUDE_CODE_SUBAGENT_EFFORT</text><text x="106" y="318" class="m">new in 2.1.316: fallback for every subagent</text>
<rect x="90" y="342" width="470" height="56" rx="6" fill="#2a2111" stroke="#f5b14c"/>
<text x="106" y="366" class="t">Session effort level</text><text x="106" y="388" class="m">what subagents inherited before 2.1.316</text>
<text x="600" y="92" class="m">set? use it</text>
<text x="600" y="162" class="m">set? use it</text>
<text x="600" y="232" class="m">set? use it</text>
<text x="600" y="296" class="t">set? use it, instead</text><text x="600" y="318" class="t">of the session's level</text>
<text x="600" y="372" class="m">nothing set: inherit</text>
<text x="30" y="425" class="m">An xhigh or max session no longer has to mean xhigh or max for every Explore or helper agent it starts.</text>
</svg>
