<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">How often people reject what Claude asks for</title><desc id="d">Bar chart of rejection rates from Claude Code usage data: 39 percent of presented plans are rejected, but only 3 percent of individual permission prompts are rejected; 97 percent of permission prompts are approved.</desc>
<rect width="900" height="400" fill="#0d1218"/>
<text x="30" y="44" fill="#e6ebf2" font-size="22" font-weight="700">How often people reject what Claude asks for</text>
<text x="30" y="70" fill="#8b98a8" font-size="14">Rejection rate by dialog type, Claude Code usage data</text>
<line x1="250.0" y1="110" x2="250.0" y2="314" stroke="#2a3441" stroke-width="1"/>
<text x="250.0" y="102" fill="#8b98a8" font-size="13" text-anchor="middle">0%</text>
<line x1="362.5" y1="110" x2="362.5" y2="314" stroke="#2a3441" stroke-width="1"/>
<text x="362.5" y="102" fill="#8b98a8" font-size="13" text-anchor="middle">25%</text>
<line x1="475.0" y1="110" x2="475.0" y2="314" stroke="#2a3441" stroke-width="1"/>
<text x="475.0" y="102" fill="#8b98a8" font-size="13" text-anchor="middle">50%</text>
<line x1="587.5" y1="110" x2="587.5" y2="314" stroke="#2a3441" stroke-width="1"/>
<text x="587.5" y="102" fill="#8b98a8" font-size="13" text-anchor="middle">75%</text>
<line x1="700.0" y1="110" x2="700.0" y2="314" stroke="#2a3441" stroke-width="1"/>
<text x="700.0" y="102" fill="#8b98a8" font-size="13" text-anchor="middle">100%</text>
<text x="236" y="138.0" fill="#e6ebf2" font-size="15" text-anchor="end">Plan approval</text>
<text x="236" y="156.0" fill="#e6ebf2" font-size="15" text-anchor="end">dialogs rejected</text>
<rect x="250" y="120" width="175.5" height="44" rx="4" fill="#f5b14c"/>
<text x="435.5" y="148.0" fill="#e6ebf2" font-size="16" font-weight="700">39%</text>
<text x="236" y="208.0" fill="#e6ebf2" font-size="15" text-anchor="end">Individual permission</text>
<text x="236" y="226.0" fill="#e6ebf2" font-size="15" text-anchor="end">prompts rejected</text>
<rect x="250" y="190" width="13.5" height="44" rx="4" fill="#ff6b6b"/>
<text x="273.5" y="218.0" fill="#e6ebf2" font-size="16" font-weight="700">3%</text>
<text x="236" y="278.0" fill="#e6ebf2" font-size="15" text-anchor="end">Permission prompts</text>
<text x="236" y="296.0" fill="#e6ebf2" font-size="15" text-anchor="end">approved</text>
<rect x="250" y="260" width="436.5" height="44" rx="4" fill="#6cb6ff"/>
<text x="696.5" y="288.0" fill="#e6ebf2" font-size="16" font-weight="700">97%</text>
<text x="250" y="378" fill="#8b98a8" font-size="13">Source: Anthropic, "Auto mode is now the default in Claude Code", Claude Code usage data.</text>
</svg>