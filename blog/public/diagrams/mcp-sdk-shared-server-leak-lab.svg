<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="t d">
  <title id="t">Lab results: three server wiring patterns on 2.2.0 and 2.3.0</title>
  <desc id="d">Grid of six lab runs. One McpServer at startup with a transport per request: on 2.2.0 Bob receives Alice's result; on 2.3.0 Bob gets HTTP 500 already connected. One shared stateless transport: on 2.2.0 Bob receives Alice's result; on 2.3.0 Bob gets HTTP 500. A new server and transport per request: both clients get their own result on both versions.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e6ebf2; font-size: 15px; }
    .m { fill: #8b98a8; }
    .code { font-family: ui-monospace, monospace; font-size: 14px; }
    .cell { fill: #131a23; stroke-width: 2; }
  </style>
  <rect width="900" height="420" fill="#0d1218"/>
  <text x="30" y="40" class="m">Server wiring</text>
  <text x="465" y="40" text-anchor="middle" class="code">server 2.2.0</text>
  <text x="735" y="40" text-anchor="middle" class="code">server 2.3.0</text>

  <!-- Row 1 -->
  <text x="30" y="92">One McpServer at startup,</text>
  <text x="30" y="114">transport per request</text>
  <text x="30" y="136" class="m">old README example</text>
  <rect class="cell" x="340" y="66" width="250" height="90" rx="8" stroke="#ff6b6b"/>
  <text x="465" y="98" text-anchor="middle">Bob receives</text>
  <text x="465" y="120" text-anchor="middle" class="code">"profile of alice"</text>
  <text x="465" y="142" text-anchor="middle" class="m">Alice: connection fails</text>
  <rect class="cell" x="610" y="66" width="250" height="90" rx="8" stroke="#f5b14c"/>
  <text x="735" y="98" text-anchor="middle">Bob gets HTTP 500</text>
  <text x="735" y="120" text-anchor="middle" class="code">already connected</text>
  <text x="735" y="142" text-anchor="middle" class="m">Alice: own result</text>

  <!-- Row 2 -->
  <text x="30" y="204">One stateless transport</text>
  <text x="30" y="226">shared by all requests</text>
  <rect class="cell" x="340" y="176" width="250" height="90" rx="8" stroke="#ff6b6b"/>
  <text x="465" y="208" text-anchor="middle">Bob receives</text>
  <text x="465" y="230" text-anchor="middle" class="code">"profile of alice"</text>
  <text x="465" y="252" text-anchor="middle" class="m">Alice: timeout after 3 s</text>
  <rect class="cell" x="610" y="176" width="250" height="90" rx="8" stroke="#f5b14c"/>
  <text x="735" y="216" text-anchor="middle">Bob gets HTTP 500</text>
  <text x="735" y="240" text-anchor="middle" class="m">Alice: own result</text>

  <!-- Row 3 -->
  <text x="30" y="314">New McpServer and</text>
  <text x="30" y="336">transport per request</text>
  <rect class="cell" x="340" y="286" width="250" height="90" rx="8" stroke="#5fd38d"/>
  <text x="465" y="326" text-anchor="middle">Each client gets</text>
  <text x="465" y="350" text-anchor="middle">its own result</text>
  <rect class="cell" x="610" y="286" width="250" height="90" rx="8" stroke="#5fd38d"/>
  <text x="735" y="326" text-anchor="middle">Each client gets</text>
  <text x="735" y="350" text-anchor="middle">its own result</text>

  <text x="30" y="404" class="m">Alice sends id 0 first (50 ms tool call), Bob sends id 0 next (500 ms tool call). Node 22.22.0, node:http.</text>
</svg>
