<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">Pod deletion fans out to two watchers at the same time</title>
  <desc id="d">Sequence diagram. The API server sets the pod's deletionTimestamp. The kubelet and the EndpointSlice controller both see it at the same time. The kubelet sends SIGTERM to the app, which closes its listener. The EndpointSlice controller marks the endpoint terminating, and kube-proxy and ingress controllers update their routes later. A new connection routed in that gap reaches a pod that is already shutting down and fails.</desc>
  <style>
    .lbl{fill:#e6ebf2;font-size:15px}
    .mut{fill:#8b98a8;font-size:14px}
    .code{font-family:ui-monospace, monospace;font-size:14px}
    .life{stroke:#2a3441;stroke-width:2;stroke-dasharray:6 6}
    @media (prefers-reduced-motion: no-preference){
      .pkt{animation:move 6s linear infinite}
      @keyframes move{0%{transform:translateX(0);opacity:0}10%{opacity:1}55%{transform:translateX(-350px);opacity:1}62%{transform:translateX(-350px);opacity:0}100%{opacity:0}}
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6ff"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f5b14c"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="960" height="620" fill="#0d1218"/>
  <!-- participants -->
  <g>
    <rect x="30" y="24" width="150" height="48" rx="8" fill="#141b24" stroke="#2a3441"/>
    <text x="105" y="54" text-anchor="middle" class="lbl">API server</text>
    <rect x="215" y="24" width="150" height="48" rx="8" fill="#141b24" stroke="#2a3441"/>
    <text x="290" y="54" text-anchor="middle" class="lbl">kubelet</text>
    <rect x="400" y="24" width="160" height="48" rx="8" fill="#141b24" stroke="#2a3441"/>
    <text x="480" y="54" text-anchor="middle" class="lbl">app container</text>
    <rect x="595" y="24" width="150" height="48" rx="8" fill="#141b24" stroke="#2a3441"/>
    <text x="670" y="46" text-anchor="middle" class="lbl">EndpointSlice</text>
    <text x="670" y="64" text-anchor="middle" class="mut">controller</text>
    <rect x="775" y="24" width="160" height="48" rx="8" fill="#141b24" stroke="#2a3441"/>
    <text x="855" y="46" text-anchor="middle" class="lbl">kube-proxy,</text>
    <text x="855" y="64" text-anchor="middle" class="mut">ingress, LBs</text>
  </g>
  <line x1="105" y1="72" x2="105" y2="560" class="life"/>
  <line x1="290" y1="72" x2="290" y2="560" class="life"/>
  <line x1="480" y1="72" x2="480" y2="560" class="life"/>
  <line x1="670" y1="72" x2="670" y2="560" class="life"/>
  <line x1="855" y1="72" x2="855" y2="560" class="life"/>

  <!-- step 1 -->
  <rect x="30" y="96" width="150" height="54" rx="6" fill="#1b2430" stroke="#6cb6ff"/>
  <text x="105" y="118" text-anchor="middle" class="code" fill="#e6ebf2">deletionTimestamp</text>
  <text x="105" y="139" text-anchor="middle" class="mut">set, t = 0</text>

  <!-- fan out -->
  <line x1="180" y1="180" x2="286" y2="180" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="196" y="172" class="mut">watch</text>
  <line x1="180" y1="210" x2="666" y2="210" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
  <text x="400" y="202" class="mut">watch, at the same time</text>

  <!-- kubelet signal -->
  <line x1="290" y1="252" x2="476" y2="252" stroke="#f5b14c" stroke-width="2" marker-end="url(#aa)"/>
  <text x="300" y="244" class="code" fill="#f5b14c">SIGTERM</text>
  <rect x="405" y="268" width="150" height="50" rx="6" fill="#2a1a1a" stroke="#ff6b6b"/>
  <text x="480" y="289" text-anchor="middle" class="lbl">closes listener,</text>
  <text x="480" y="309" text-anchor="middle" class="lbl">exits</text>

  <!-- slice update path -->
  <rect x="598" y="232" width="144" height="54" rx="6" fill="#1b2430" stroke="#6cb6ff"/>
  <text x="670" y="254" text-anchor="middle" class="code" fill="#e6ebf2">terminating:</text>
  <text x="670" y="274" text-anchor="middle" class="code" fill="#e6ebf2">true</text>
  <line x1="742" y1="420" x2="851" y2="420" stroke="#6cb6ff" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="670" y1="286" x2="670" y2="420" stroke="#6cb6ff" stroke-width="2"/>
  <line x1="670" y1="420" x2="742" y2="420" stroke="#6cb6ff" stroke-width="2"/>
  <text x="684" y="382" class="mut">watch, then</text>
  <text x="684" y="402" class="mut">rewrite rules</text>
  <rect x="780" y="436" width="150" height="50" rx="6" fill="#132619" stroke="#5fd38d"/>
  <text x="855" y="457" text-anchor="middle" class="lbl">routes updated:</text>
  <text x="855" y="477" text-anchor="middle" class="lbl">pod removed</text>

  <!-- failing request in the gap -->
  <line x1="855" y1="345" x2="486" y2="345" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="560" y="335" class="lbl" fill="#ff6b6b" style="fill:#ff6b6b">new connection</text>
  <circle class="pkt" cx="850" cy="345" r="7" fill="#ff6b6b"/>
  <text x="300" y="350" class="code" fill="#ff6b6b">refused / 502</text>

  <!-- gap bracket -->
  <path d="M945 252 L952 252 L952 420 L945 420" fill="none" stroke="#f5b14c" stroke-width="2"/>
  <text x="930" y="300" text-anchor="end" class="mut" style="fill:#f5b14c">gap</text>

  <rect x="30" y="512" width="905" height="84" rx="8" fill="#1f1a10" stroke="#f5b14c"/>
  <text x="50" y="542" class="lbl">The gap: between SIGTERM and the route update, proxies still send new</text>
  <text x="50" y="566" class="lbl">connections to a pod that is shutting down. Nothing in Kubernetes orders</text>
  <text x="50" y="588" class="lbl">these two paths, so the app has to keep serving until routes catch up.</text>
</svg>
