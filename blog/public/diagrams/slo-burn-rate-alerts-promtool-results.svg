<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="t d">
<title id="t">Three incidents, two alerts: which one paged</title>
<desc id="d">Bar chart of the share of a 30-day error budget burned by three incidents at a 99.9% SLO, with the result of each alert. 2% errors for 10 minutes burned 0.46%: HighErrorRate paged at 8 minutes, ErrorBudgetBurn stayed silent. 20% errors for 30 minutes burned 13.9%: HighErrorRate paged at 6 minutes, ErrorBudgetBurn at 5 minutes. 0.8% errors for 24 hours burned 26.7%: HighErrorRate stayed silent, ErrorBudgetBurn paged at 4 hours 30 minutes.</desc>
<rect width="920" height="500" fill="#0d1218"/>
<g font-family="ui-sans-serif, system-ui, sans-serif">
<text x="30" y="42" fill="#e6ebf2" font-size="21" font-weight="600" text-anchor="start" >Three incidents, two alerts: which one paged</text>
<text x="30" y="68" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >99.9% SLO over 30 days, 100 requests/s. Results from promtool 3.16.0 rule unit tests.</text>
<text x="30" y="112" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >INCIDENT</text>
<text x="230" y="112" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >30-DAY ERROR BUDGET BURNED</text>
<text x="516" y="104" fill="#e6ebf2" font-size="15" font-weight="600" text-anchor="start" font-family="ui-monospace, monospace">HighErrorRate</text>
<text x="516" y="124" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >&gt; 1% for 5m</text>
<text x="712" y="104" fill="#e6ebf2" font-size="15" font-weight="600" text-anchor="start" font-family="ui-monospace, monospace">ErrorBudgetBurn</text>
<text x="712" y="124" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >2 burn rates, 4 windows</text>
<line x1="230.0" y1="140" x2="230.0" y2="420" stroke="#2a3441" stroke-width="1"/>
<text x="230.0" y="442" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >0%</text>
<line x1="313.3" y1="140" x2="313.3" y2="420" stroke="#2a3441" stroke-width="1"/>
<text x="313.3" y="442" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >10%</text>
<line x1="396.7" y1="140" x2="396.7" y2="420" stroke="#2a3441" stroke-width="1"/>
<text x="396.7" y="442" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >20%</text>
<line x1="480.0" y1="140" x2="480.0" y2="420" stroke="#2a3441" stroke-width="1"/>
<text x="480.0" y="442" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >30%</text>
<text x="30" y="180" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >2% errors</text>
<text x="30" y="202" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >for 10 min</text>
<rect x="230" y="162" width="3.9" height="40" rx="3" fill="#6cb6ff"/>
<text x="243.9" y="188" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >0.46%</text>
<rect x="516" y="150" width="188" height="66" rx="8" fill="#141b24" stroke="#ff6b6b" stroke-width="2"/>
<text x="530" y="178" fill="#ff6b6b" font-size="16" font-weight="600" text-anchor="start" >Paged at 8 min</text>
<text x="530" y="200" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >noise</text>
<rect x="712" y="150" width="188" height="66" rx="8" fill="#141b24" stroke="#5fd38d" stroke-width="2"/>
<text x="726" y="178" fill="#5fd38d" font-size="16" font-weight="600" text-anchor="start" >Silent</text>
<text x="726" y="200" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >right call</text>
<text x="30" y="272" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >20% errors</text>
<text x="30" y="294" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >for 30 min</text>
<rect x="230" y="254" width="115.7" height="40" rx="3" fill="#6cb6ff"/>
<text x="355.7" y="280" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >13.9%</text>
<rect x="516" y="242" width="188" height="66" rx="8" fill="#141b24" stroke="#5fd38d" stroke-width="2"/>
<text x="530" y="270" fill="#5fd38d" font-size="16" font-weight="600" text-anchor="start" >Paged at 6 min</text>
<text x="530" y="292" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >right call</text>
<rect x="712" y="242" width="188" height="66" rx="8" fill="#141b24" stroke="#5fd38d" stroke-width="2"/>
<text x="726" y="270" fill="#5fd38d" font-size="16" font-weight="600" text-anchor="start" >Paged at 5 min</text>
<text x="726" y="292" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >right call</text>
<text x="30" y="364" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >0.8% errors</text>
<text x="30" y="386" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >for 24 h</text>
<rect x="230" y="346" width="222.2" height="40" rx="3" fill="#6cb6ff"/>
<text x="442.2" y="372" fill="#0d1218" font-size="16" font-weight="600" text-anchor="end" >26.7%</text>
<rect x="516" y="334" width="188" height="66" rx="8" fill="#141b24" stroke="#ff6b6b" stroke-width="2"/>
<text x="530" y="362" fill="#ff6b6b" font-size="16" font-weight="600" text-anchor="start" >Silent</text>
<text x="530" y="384" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >missed</text>
<rect x="712" y="334" width="188" height="66" rx="8" fill="#141b24" stroke="#5fd38d" stroke-width="2"/>
<text x="726" y="362" fill="#5fd38d" font-size="16" font-weight="600" text-anchor="start" >Paged at 4 h 30 min</text>
<text x="726" y="384" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >right call</text>
<text x="30" y="480" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >Green: the alert did what an on-call engineer needs. Red: it paged for noise or missed a real burn.</text>
</g>
</svg>
