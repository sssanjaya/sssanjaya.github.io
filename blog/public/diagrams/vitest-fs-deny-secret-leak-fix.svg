<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">Before and after the fix</title>
  <desc id="d">Two terminal panels. On Vitest 5.0.4, a GET of the API token file over the dev server returns HTTP 200 with the secret token. On Vitest 5.0.5, the same request returns HTTP 403 Restricted and the token stays secret.</desc>
  <rect width="900" height="440" fill="#0d1218"/>
  <text x="30" y="40" fill="#e6ebf2" font-size="22" font-weight="700">Same request, before and after 5.0.5</text>

  <!-- before -->
  <rect x="30" y="64" width="408" height="330" rx="10" fill="#0a0f14" stroke="#ff6b6b"/>
  <text x="50" y="94" fill="#ff6b6b" font-size="15" font-weight="700">vitest 5.0.4  (vulnerable)</text>
  <text x="50" y="128" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">$ vitest --watch --api</text>
  <text x="50" y="150" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">$ curl -s localhost:51204/node_modules/</text>
  <text x="50" y="168" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">    .vitest/.vitest-secret-token?raw</text>
  <line x1="50" y1="182" x2="418" y2="182" stroke="#1b2430"/>
  <text x="50" y="208" fill="#e6ebf2" font-size="12.5" font-family="ui-monospace, monospace">HTTP/1.1 200 OK</text>
  <text x="50" y="228" fill="#e6ebf2" font-size="12.5" font-family="ui-monospace, monospace">content-type: text/javascript</text>
  <text x="50" y="256" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">const __vite_ssr_export_default__ =</text>
  <text x="50" y="276" fill="#ff6b6b" font-size="12.5" font-family="ui-monospace, monospace">  "13ba4d82-551a-49ec-b7e4-</text>
  <text x="50" y="294" fill="#ff6b6b" font-size="12.5" font-family="ui-monospace, monospace">   f878226fedcb\n"</text>
  <rect x="50" y="318" width="358" height="54" rx="6" fill="#241416" stroke="#ff6b6b"/>
  <text x="229" y="342" fill="#ff6b6b" font-size="13.5" text-anchor="middle" font-weight="700">API token leaked</text>
  <text x="229" y="362" fill="#8b98a8" font-size="12" text-anchor="middle">authenticates the privileged WebSocket</text>

  <!-- after -->
  <rect x="462" y="64" width="408" height="330" rx="10" fill="#0a0f14" stroke="#5fd38d"/>
  <text x="482" y="94" fill="#5fd38d" font-size="15" font-weight="700">vitest 5.0.5  (patched)</text>
  <text x="482" y="128" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">$ vitest --watch --api</text>
  <text x="482" y="150" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">$ curl -s localhost:51205/node_modules/</text>
  <text x="482" y="168" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">    .vitest/.vitest-secret-token?raw</text>
  <line x1="482" y1="182" x2="850" y2="182" stroke="#1b2430"/>
  <text x="482" y="208" fill="#e6ebf2" font-size="12.5" font-family="ui-monospace, monospace">HTTP/1.1 403 Restricted</text>
  <text x="482" y="236" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">&lt;h1&gt;403 Restricted&lt;/h1&gt;</text>
  <text x="482" y="256" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">the request is outside the Vite</text>
  <text x="482" y="274" fill="#8b98a8" font-size="12.5" font-family="ui-monospace, monospace">serving allow list</text>
  <rect x="482" y="318" width="358" height="54" rx="6" fill="#132018" stroke="#5fd38d"/>
  <text x="661" y="342" fill="#5fd38d" font-size="13.5" text-anchor="middle" font-weight="700">token stays secret</text>
  <text x="661" y="362" fill="#8b98a8" font-size="12" text-anchor="middle">default fs.deny kept with the token entry</text>
</svg>
