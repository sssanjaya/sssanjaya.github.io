<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">The same request under two API versions</title>
<desc id="d">A Messages request that sends temperature 0.2. With anthropic-version 2023-06-01 it is accepted. With anthropic-version 2026-10-21 it returns a 400 error, even at the default value. New SDK majors send 2026-10-21 by default: Python 2.0.0, TypeScript 1.0.0, Go 2.0.0, Java 3.0.0, C# 13.0.0, ant CLI 2.0.0.</desc>
<style>
.p{fill:#0d1218}.b{fill:#121a23;stroke:#2a3441;stroke-width:2}.t{fill:#e6ebf2;font-size:17px}.m{fill:#8b98a8;font-size:15px}.c{font-family:ui-monospace, monospace;font-size:15px;fill:#e6ebf2}.h{font-size:19px;font-weight:700;fill:#e6ebf2}
@media (prefers-reduced-motion: no-preference){.dot{animation:mv 6s linear infinite}.dot2{animation:mv 6s linear infinite;animation-delay:3s;opacity:0}
@keyframes mv{0%{transform:translateX(0);opacity:1}45%{transform:translateX(250px);opacity:1}50%,100%{transform:translateX(250px);opacity:0}}}
</style>
<rect class="p" width="900" height="470"/>
<text x="30" y="40" class="h">One request body, two API versions</text>
<rect class="b" x="30" y="70" width="300" height="170" rx="8"/>
<text x="48" y="100" class="m">POST /v1/messages</text>
<text x="48" y="130" class="c">"model": "claude-sonnet-4-6",</text>
<text x="48" y="155" class="c">"max_tokens": 64,</text>
<text x="48" y="180" class="c" fill="#f5b14c" style="fill:#f5b14c">"temperature": 0.2,</text>
<text x="48" y="205" class="c">"messages": [ ... ]</text>
<path d="M330 120 H 590" stroke="#6cb6ff" stroke-width="2.5"/>
<path d="M330 190 H 590" stroke="#6cb6ff" stroke-width="2.5"/>
<text x="350" y="110" class="c" style="fill:#6cb6ff">anthropic-version: 2023-06-01</text>
<text x="350" y="180" class="c" style="fill:#6cb6ff">anthropic-version: 2026-10-21</text>
<circle class="dot" cx="340" cy="120" r="6" fill="#6cb6ff"/>
<circle class="dot2" cx="340" cy="190" r="6" fill="#6cb6ff"/>
<rect x="600" y="95" width="270" height="50" rx="8" fill="#0f2a1c" stroke="#5fd38d" stroke-width="2"/>
<text x="618" y="126" class="t">200 OK, sampled at 0.2</text>
<rect x="600" y="165" width="270" height="50" rx="8" fill="#2c1416" stroke="#ff6b6b" stroke-width="2"/>
<text x="618" y="196" class="t">400 error</text>
<text x="600" y="240" class="m">Also 400 for top_p, top_k, at any value</text>
<line x1="30" y1="275" x2="870" y2="275" stroke="#2a3441" stroke-width="2"/>
<text x="30" y="310" class="h">First versions that send 2026-10-21 by default</text>
<g class="c">
<text x="30" y="350">Python anthropic</text><text x="250" y="350" style="fill:#5fd38d">2.0.0</text>
<text x="330" y="350">TypeScript @anthropic-ai/sdk</text><text x="640" y="350" style="fill:#5fd38d">1.0.0</text>
<text x="30" y="385">Go anthropic-sdk-go/v2</text><text x="250" y="385" style="fill:#5fd38d">2.0.0</text>
<text x="330" y="385">Java anthropic-java</text><text x="640" y="385" style="fill:#5fd38d">3.0.0</text>
<text x="30" y="420">C# Anthropic</text><text x="250" y="420" style="fill:#5fd38d">13.0.0</text>
<text x="330" y="420">ant CLI</text><text x="640" y="420" style="fill:#5fd38d">2.0.0</text>
</g>
<text x="30" y="452" class="m">PHP 1.0.0 and Ruby 2.0.0 too. Licenses move from MIT to Apache 2.0.</text>
</svg>
