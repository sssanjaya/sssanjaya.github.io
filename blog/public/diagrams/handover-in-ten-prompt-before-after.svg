<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" role="img" aria-labelledby="t d">
<title id="t">A typical handover message next to the note the prompt produces</title>
<desc id="d">Before and after. Before: a one-line chat message saying the export is mostly done and to ping the writer with questions; it has no current state, no next action, and no owner for questions. After: a one-page note with ten sections: State Right Now, Next Three Actions, What Only I Knew, Traps, Do Not Touch, If It Goes Wrong, Who To Ask, Where Things Live, Unknowns, Do This Now.</desc>
<rect width="920" height="600" fill="#0d1218"/>
<g font-family="ui-sans-serif, system-ui, sans-serif">
<text x="30" y="42" fill="#e6ebf2" font-size="21" font-weight="600" text-anchor="start" >What the next person gets</text>
<text x="30" y="68" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >The usual one-liner next to the ten sections the prompt fills in</text>
<text x="30" y="108" fill="#ff6b6b" font-size="14" font-weight="600" text-anchor="start" >BEFORE</text>
<rect x="30" y="120" width="330" height="150" rx="10" fill="#141b24" stroke="#ff6b6b" stroke-width="2"/>
<text x="50" y="154" fill="#e6ebf2" font-size="17" font-weight="400" text-anchor="start" >“Billing export is mostly</text>
<text x="50" y="180" fill="#e6ebf2" font-size="17" font-weight="400" text-anchor="start" >done. Ping me if you have</text>
<text x="50" y="206" fill="#e6ebf2" font-size="17" font-weight="400" text-anchor="start" >questions.”</text>
<text x="50" y="246" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >sent at 6 pm, then out for a week</text>
<path d="M36 300 L48 312 M48 300 L36 312" stroke="#ff6b6b" stroke-width="2.5"/>
<text x="62" y="312" fill="#e6ebf2" font-size="16" font-weight="400" text-anchor="start" >No current state</text>
<path d="M36 344 L48 356 M48 344 L36 356" stroke="#ff6b6b" stroke-width="2.5"/>
<text x="62" y="356" fill="#e6ebf2" font-size="16" font-weight="400" text-anchor="start" >No next action</text>
<path d="M36 388 L48 400 M48 388 L36 400" stroke="#ff6b6b" stroke-width="2.5"/>
<text x="62" y="400" fill="#e6ebf2" font-size="16" font-weight="400" text-anchor="start" >No way to check anything</text>
<path d="M36 432 L48 444 M48 432 L36 444" stroke="#ff6b6b" stroke-width="2.5"/>
<text x="62" y="444" fill="#e6ebf2" font-size="16" font-weight="400" text-anchor="start" >Nobody else to ask</text>
<text x="400" y="108" fill="#5fd38d" font-size="14" font-weight="600" text-anchor="start" >AFTER</text>
<rect x="400" y="120" width="490" height="450" rx="10" fill="#141b24" stroke="#5fd38d" stroke-width="2"/>
<text x="420" y="167" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >State Right Now</text>
<text x="870" y="167" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >works, broken, running</text>
<line x1="420" y1="182" x2="870" y2="182" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="209" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Next Three Actions</text>
<text x="870" y="209" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >each with a check</text>
<line x1="420" y1="224" x2="870" y2="224" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="251" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >What Only I Knew</text>
<text x="870" y="251" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >workarounds, oddities</text>
<line x1="420" y1="266" x2="870" y2="266" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="293" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Traps</text>
<text x="870" y="293" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >looks fine but is not</text>
<line x1="420" y1="308" x2="870" y2="308" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="335" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Do Not Touch</text>
<text x="870" y="335" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >marks what cannot be undone</text>
<line x1="420" y1="350" x2="870" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="377" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >If It Goes Wrong</text>
<text x="870" y="377" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >first sign, first move</text>
<line x1="420" y1="392" x2="870" y2="392" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="419" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Who To Ask</text>
<text x="870" y="419" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >name and what they know</text>
<line x1="420" y1="434" x2="870" y2="434" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="461" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Where Things Live</text>
<text x="870" y="461" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >locations, no secrets</text>
<line x1="420" y1="476" x2="870" y2="476" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="503" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Unknowns</text>
<text x="870" y="503" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >and who can settle them</text>
<line x1="420" y1="518" x2="870" y2="518" stroke="#2a3441" stroke-width="1"/>
<text x="420" y="545" fill="#e6ebf2" font-size="16" font-weight="600" text-anchor="start" >Do This Now</text>
<text x="870" y="545" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >one action before leaving</text>
</g>
</svg>
