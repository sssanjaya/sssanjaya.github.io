<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-labelledby="t d">
<title id="t">Outage timeline: when each alert fired and cleared</title>
<desc id="d">Timeline for 20% errors lasting 30 minutes. ErrorBudgetBurn fast fires from minute 5 to minute 34. HighErrorRate fires from minute 6 to minute 34. ErrorBudgetBurn slow fires from minute 11 to minute 59, 29 minutes after the errors stop.</desc>
<rect width="920" height="420" fill="#0d1218"/>
<g font-family="ui-sans-serif, system-ui, sans-serif">
<text x="30" y="42" fill="#e6ebf2" font-size="21" font-weight="600" text-anchor="start" >The real outage: 20% errors for 30 minutes</text>
<text x="30" y="68" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >Firing intervals from promtool 3.16.0, evaluated every minute</text>
<line x1="295.0" y1="92" x2="295.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="295.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >0</text>
<line x1="385.0" y1="92" x2="385.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="385.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >10</text>
<line x1="475.0" y1="92" x2="475.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="475.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >20</text>
<line x1="565.0" y1="92" x2="565.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="565.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >30</text>
<line x1="655.0" y1="92" x2="655.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="655.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >40</text>
<line x1="745.0" y1="92" x2="745.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="745.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >50</text>
<line x1="835.0" y1="92" x2="835.0" y2="350" stroke="#2a3441" stroke-width="1"/>
<text x="835.0" y="374" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >60</text>
<text x="565.0" y="400" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >Minutes since errors started</text>
<text x="30" y="122" fill="#e6ebf2" font-size="15" font-weight="600" text-anchor="start" >Errors served</text>
<text x="30" y="142" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >20% of requests</text>
<rect x="295.0" y="106" width="270.0" height="36" rx="4" fill="#ff6b6b" fill-opacity="0.75"/>
<text x="305.0" y="130" fill="#0d1218" font-size="15" font-weight="600" text-anchor="start" >0 to 30 min</text>
<text x="30" y="184" fill="#e6ebf2" font-size="15" font-weight="600" text-anchor="start" font-family="ui-monospace, monospace">ErrorBudgetBurn</text>
<text x="30" y="204" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >burn=fast (1h and 5m)</text>
<rect x="340.0" y="168" width="261.0" height="36" rx="4" fill="#5fd38d" fill-opacity="0.9"/>
<text x="350.0" y="192" fill="#0d1218" font-size="15" font-weight="600" text-anchor="start" >5 to 34 min</text>
<text x="30" y="246" fill="#e6ebf2" font-size="15" font-weight="600" text-anchor="start" font-family="ui-monospace, monospace">HighErrorRate</text>
<text x="30" y="266" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >&gt; 1% for 5m</text>
<rect x="349.0" y="230" width="252.0" height="36" rx="4" fill="#f5b14c" fill-opacity="0.9"/>
<text x="359.0" y="254" fill="#0d1218" font-size="15" font-weight="600" text-anchor="start" >6 to 34 min</text>
<text x="30" y="308" fill="#e6ebf2" font-size="15" font-weight="600" text-anchor="start" font-family="ui-monospace, monospace">ErrorBudgetBurn</text>
<text x="30" y="328" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="start" >burn=slow (6h and 30m)</text>
<rect x="394.0" y="292" width="432.0" height="36" rx="4" fill="#5fd38d" fill-opacity="0.9"/>
<text x="404.0" y="316" fill="#0d1218" font-size="15" font-weight="600" text-anchor="start" >11 to 59 min</text>
<line x1="565.0" y1="92" x2="565.0" y2="350" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5 4"/>
</g>
</svg>
