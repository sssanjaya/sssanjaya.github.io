<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">EndpointSlice conditions before and after a pod is deleted</title>
  <desc id="d">Before deletion the endpoint shows ready true, serving true, terminating false, and proxies route new connections to it. Right after kubectl delete, captured from a v1.37.2 control plane, it shows ready false, serving true, terminating true. Proxies skip it for new traffic, unless every endpoint of the Service is terminating, in which case they may use the serving ones.</desc>
  <style>
    .l{fill:#e6ebf2;font-size:16px}
    .m{fill:#8b98a8;font-size:14px}
    .c{font-family:ui-monospace, monospace;font-size:16px}
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6ff"/></marker>
  </defs>
  <rect width="960" height="470" fill="#0d1218"/>

  <text x="40" y="44" class="l">Pod Running and Ready</text>
  <rect x="40" y="62" width="360" height="130" rx="8" fill="#141b24" stroke="#2a3441"/>
  <text x="64" y="98" class="c" fill="#e6ebf2">ready:       <tspan fill="#5fd38d">true</tspan></text>
  <text x="64" y="130" class="c" fill="#e6ebf2">serving:     <tspan fill="#5fd38d">true</tspan></text>
  <text x="64" y="162" class="c" fill="#e6ebf2">terminating: <tspan fill="#8b98a8">false</tspan></text>

  <line x1="412" y1="127" x2="540" y2="127" stroke="#6cb6ff" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="476" y="112" text-anchor="middle" class="c" fill="#6cb6ff">kubectl</text>
  <text x="476" y="150" text-anchor="middle" class="c" fill="#6cb6ff">delete</text>

  <text x="560" y="44" class="l">Pod Terminating</text>
  <rect x="560" y="62" width="360" height="130" rx="8" fill="#141b24" stroke="#f5b14c"/>
  <text x="584" y="98" class="c" fill="#e6ebf2">ready:       <tspan fill="#ff6b6b">false</tspan></text>
  <text x="584" y="130" class="c" fill="#e6ebf2">serving:     <tspan fill="#5fd38d">true</tspan></text>
  <text x="584" y="162" class="c" fill="#e6ebf2">terminating: <tspan fill="#f5b14c">true</tspan></text>

  <rect x="40" y="222" width="360" height="96" rx="8" fill="#132619" stroke="#5fd38d"/>
  <text x="60" y="256" class="l">Proxies send new connections</text>
  <text x="60" y="282" class="l">here.</text>

  <rect x="560" y="222" width="360" height="96" rx="8" fill="#1f1a10" stroke="#f5b14c"/>
  <text x="580" y="252" class="l">Proxies skip it for new traffic,</text>
  <text x="580" y="276" class="l">unless every endpoint is terminating:</text>
  <text x="580" y="300" class="l">then they may use serving ones.</text>

  <rect x="40" y="348" width="880" height="96" rx="8" fill="#141b24" stroke="#2a3441"/>
  <text x="60" y="380" class="l">The control plane flips these fields on delete, with no kubelet involved and</text>
  <text x="60" y="406" class="l">before any container stops. Failing readiness after SIGTERM only changes</text>
  <text x="60" y="432" class="l">serving: ready is already false.</text>
</svg>
