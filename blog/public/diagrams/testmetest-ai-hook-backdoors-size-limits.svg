<text x="284" y="116" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#e6ebf2" text-anchor="end">Code search index limit</text>
<text x="284" y="135" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8" text-anchor="end">files over this are skipped</text>
<rect x="300" y="96" width="12.5" height="44" rx="3" fill="#6cb6ff"/>
