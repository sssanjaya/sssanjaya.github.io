<text x="32" y="468" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8">Limits: GitHub Docs (code search, REST contents API). Payload sizes: JFrog Security Research, 26 Oct 2026.</text>
