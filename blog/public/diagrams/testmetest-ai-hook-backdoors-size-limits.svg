<line x1="440.0" y1="86" x2="440.0" y2="362" stroke="#2a3441" stroke-width="1"/>
<text x="440.0" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8" text-anchor="middle">4</text>
<line x1="510.0" y1="86" x2="510.0" y2="362" stroke="#2a3441" stroke-width="1"/>
<text x="510.0" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8" text-anchor="middle">6</text>
<line x1="580.0" y1="86" x2="580.0" y2="362" stroke="#2a3441" stroke-width="1"/>
<text x="580.0" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8" text-anchor="middle">8</text>
<line x1="650.0" y1="86" x2="650.0" y2="362" stroke="#2a3441" stroke-width="1"/>
<text x="650.0" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8" text-anchor="middle">10</text>
<line x1="720.0" y1="86" x2="720.0" y2="362" stroke="#2a3441" stroke-width="1"/>
