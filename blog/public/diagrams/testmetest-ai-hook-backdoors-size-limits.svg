<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" role="img" aria-labelledby="t d">
<title id="t">Payload size versus GitHub search and API limits</title><desc id="d">Horizontal bars in megabytes. GitHub code search skips files over 350 KiB (about 0.36 MB). The contents API supports all features only up to 1 MB. The testmetest init.js wrappers measured 12.9 MB to 13.7 MB, about 36 to 38 times the code search limit.</desc>
<rect width="900" height="486" fill="#0d1218"/>
<text x="32" y="48" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#e6ebf2">The payload is about 37x what code search will index</text>
<line x1="300.0" y1="86" x2="300.0" y2="362" stroke="#2a3441" stroke-width="1"/>
<text x="300.0" y="386" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#8b98a8" text-anchor="middle">0</text>
