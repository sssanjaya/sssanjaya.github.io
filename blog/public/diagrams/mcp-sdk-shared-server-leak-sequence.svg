<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">How a shared MCP server routes Alice's result to Bob</title>
  <desc id="d">Sequence diagram. Alice and Bob both send tools/call with JSON-RPC id 0 to one shared server. The transport maps id 0 to Alice's stream, then Bob's request overwrites the entry with Bob's stream. When Alice's tool call finishes, the lookup for id 0 returns Bob's stream, so Bob receives "profile of alice" and Alice receives nothing.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e6ebf2; font-size: 15px; }
    .m { fill: #8b98a8; }
    .code { font-family: ui-monospace, monospace; font-size: 14px; }
    .life { stroke: #2a3441; stroke-width: 2; stroke-dasharray: 6 6; }
    .head { fill: #131a23; stroke: #2a3441; stroke-width: 2; }
    .blue { stroke: #6cb6ff; stroke-width: 2.5; fill: none; }
    .red { stroke: #ff6b6b; stroke-width: 3; fill: none; }
    .amber { stroke: #f5b14c; stroke-width: 2.5; fill: none; }
    .dot { fill: #ff6b6b; opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .dot { animation: move 6s ease-in-out infinite; }
      @keyframes move {
        0%, 55% { opacity: 0; transform: translate(0, 0); }
        60% { opacity: 1; transform: translate(0, 0); }
        85% { opacity: 1; transform: translate(-220px, 0); }
        95%, 100% { opacity: 0; transform: translate(-220px, 0); }
      }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6cb6ff"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker>
  </defs>
  <rect width="900" height="600" fill="#0d1218"/>

  <!-- Participants -->
  <rect class="head" x="40" y="24" width="150" height="54" rx="8"/>
  <text x="115" y="50" text-anchor="middle">Client Alice</text>
  <text x="115" y="69" text-anchor="middle" class="m code">id starts at 0</text>
  <rect class="head" x="240" y="24" width="150" height="54" rx="8"/>
  <text x="315" y="50" text-anchor="middle">Client Bob</text>
  <text x="315" y="69" text-anchor="middle" class="m code">id starts at 0</text>
  <rect class="head" x="460" y="24" width="210" height="54" rx="8"/>
  <text x="565" y="50" text-anchor="middle">Shared transport</text>
  <text x="565" y="69" text-anchor="middle" class="m code">Map: id → stream</text>
  <rect class="head" x="720" y="24" width="150" height="54" rx="8"/>
  <text x="795" y="50" text-anchor="middle">Tool handler</text>
  <text x="795" y="69" text-anchor="middle" class="m code">get_profile</text>

  <line class="life" x1="115" y1="78" x2="115" y2="560"/>
  <line class="life" x1="315" y1="78" x2="315" y2="560"/>
  <line class="life" x1="565" y1="78" x2="565" y2="560"/>
  <line class="life" x1="795" y1="78" x2="795" y2="560"/>

  <!-- 1 Alice request -->
  <line class="blue" x1="115" y1="120" x2="557" y2="120" marker-end="url(#ab)"/>
  <rect x="124" y="94" width="244" height="22" fill="#0d1218"/>
  <text x="130" y="110" class="code">1  POST tools/call {"id":0, user:"alice"}</text>
  <rect x="580" y="104" width="190" height="30" rx="6" fill="#131a23" stroke="#6cb6ff"/>
  <text x="675" y="124" text-anchor="middle" class="code">0 → stream A</text>

  <!-- 2 Bob request -->
  <line class="blue" x1="315" y1="190" x2="557" y2="190" marker-end="url(#ab)"/>
  <text x="330" y="180" class="code">2  POST {"id":0, user:"bob"}</text>
  <rect x="580" y="174" width="190" height="30" rx="6" fill="#131a23" stroke="#f5b14c"/>
  <text x="675" y="194" text-anchor="middle" class="code">0 → stream B</text>
  <text x="675" y="224" text-anchor="middle" class="m">entry overwritten</text>

  <!-- 3 handler finishes alice -->
  <line class="blue" x1="565" y1="270" x2="787" y2="270" marker-end="url(#ab)"/>
  <line class="blue" x1="795" y1="320" x2="573" y2="320" marker-end="url(#ab)"/>
  <text x="600" y="260" class="code">3  run both calls</text>
  <text x="600" y="345" class="code">"profile of alice", id 0</text>
  <text x="600" y="366" class="m">finishes first (50 ms)</text>

  <!-- 4 lookup -->
  <rect x="440" y="390" width="250" height="34" rx="6" fill="#131a23" stroke="#ff6b6b"/>
  <text x="565" y="413" text-anchor="middle" class="code">4  get(0) → stream B</text>

  <!-- 5 delivered to bob -->
  <line class="red" x1="557" y1="470" x2="323" y2="470" marker-end="url(#ar)"/>
  <circle class="dot" cx="550" cy="470" r="7"/>
  <text x="340" y="458" class="code">5  Bob reads "profile of alice"</text>

  <!-- Alice nothing -->
  <rect x="30" y="500" width="260" height="46" rx="6" fill="#131a23" stroke="#f5b14c"/>
  <text x="160" y="528" text-anchor="middle">Alice's stream gets no answer</text>
</svg>
