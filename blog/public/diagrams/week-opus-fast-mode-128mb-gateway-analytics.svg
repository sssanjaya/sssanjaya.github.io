<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">Legacy Usage and Cost API versus the new Usage and Cost Analytics API</title>
<desc id="d">Comparison of four behaviors. Freshness: the legacy API typically shows data within 5 minutes; the new API typically refreshes within 4 hours and can take up to 24 hours, and reports data_refreshed_at. Response shape: legacy returns time buckets oldest first including empty ones; the new API returns rows ranked by order_by, with no row for combinations without usage. Range: legacy pages through any range; the new API allows at most 31 days per request and 24 hours with 1-minute buckets. Unknown IDs: legacy returns an error; the new API matches nothing. Values can be revised until about 7 days after month end.</desc>
<style>.t{fill:#e6ebf2;font-size:16px}.m{fill:#8b98a8;font-size:15px}.h{fill:#e6ebf2;font-size:20px;font-weight:700}.c{font-family:ui-monospace, monospace;font-size:15px}</style>
<rect width="900" height="470" fill="#0d1218"/>
<text x="30" y="40" class="h">Same data, new contract: what changes when you migrate</text>
<rect x="190" y="62" width="330" height="40" rx="6" fill="#121a23" stroke="#2a3441"/>
<text x="205" y="80" class="t" font-weight="700">Usage and Cost API</text>
<text x="205" y="97" class="m">legacy, still supported</text>
<rect x="540" y="62" width="330" height="40" rx="6" fill="#121a23" stroke="#6cb6ff"/>
<text x="555" y="80" class="t" font-weight="700">Usage and Cost Analytics API</text>
<text x="555" y="97" class="m">beta since Oct 29, 2026</text>
<g>
<text x="30" y="148" class="t" font-weight="700">Freshness</text>
<rect x="190" y="118" width="330" height="62" rx="6" fill="#0f2a1c" stroke="#5fd38d"/>
<text x="205" y="145" class="t">typically within 5 minutes</text>
<rect x="540" y="118" width="330" height="62" rx="6" fill="#2a2111" stroke="#f5b14c"/>
<text x="555" y="143" class="t">typically within 4 h, up to 24 h</text>
<text x="555" y="166" class="m c">data_refreshed_at on every response</text>
</g>
<g>
<text x="30" y="223" class="t" font-weight="700">Shape</text>
<rect x="190" y="193" width="330" height="62" rx="6" fill="#121a23" stroke="#2a3441"/>
<text x="205" y="218" class="t">time buckets, oldest first,</text>
<text x="205" y="241" class="t">empty buckets included</text>
<rect x="540" y="193" width="330" height="62" rx="6" fill="#2a2111" stroke="#f5b14c"/>
<text x="555" y="218" class="t">rows ranked by <tspan class="c">order_by</tspan>,</text>
<text x="555" y="241" class="t">no row when there is no usage</text>
</g>
<g>
<text x="30" y="298" class="t" font-weight="700">Range</text>
<rect x="190" y="268" width="330" height="62" rx="6" fill="#121a23" stroke="#2a3441"/>
<text x="205" y="304" class="t">any range, paged by bucket</text>
<rect x="540" y="268" width="330" height="62" rx="6" fill="#2a2111" stroke="#f5b14c"/>
<text x="555" y="293" class="t">at most 31 days per request,</text>
<text x="555" y="316" class="t">24 h with <tspan class="c">1m</tspan> buckets</text>
</g>
<g>
<text x="30" y="373" class="t" font-weight="700">Unknown ID</text>
<rect x="190" y="343" width="330" height="62" rx="6" fill="#121a23" stroke="#2a3441"/>
<text x="205" y="379" class="t">returns an error</text>
<rect x="540" y="343" width="330" height="62" rx="6" fill="#2c1416" stroke="#ff6b6b"/>
<text x="555" y="368" class="t">matches nothing, silently,</text>
<text x="555" y="391" class="t">even a misspelled model name</text>
</g>
<text x="30" y="445" class="m">Values can still change until about 7 days after a month ends. Amber and red: what a migrated dashboard must handle.</text>
</svg>
