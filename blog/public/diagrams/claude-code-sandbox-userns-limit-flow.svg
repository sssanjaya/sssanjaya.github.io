<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d">
<title id="t">How the Linux sandbox decides the user namespace limit</title>
<desc id="d">Three checks in order. If allowNestedUserNamespaces is true, no limit applies. Otherwise, if the seccomp helper is in use, a seccomp filter refuses namespace and mount calls and user.max_user_namespaces is set to 0. Otherwise, if bubblewrap is 0.8.0 or later, not setuid, and enableWeakerNestedSandbox is off, bubblewrap gets --disable-userns. Otherwise no limit applies and a warning is logged once per process.</desc>
<rect width="760" height="470" rx="12" fill="#0d1218"/>
<g font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
<text x="28" y="38" font-size="18" font-weight="600" fill="#e6ebf2">Which user namespace limit a sandboxed command gets</text>
<text x="28" y="60" font-size="14" fill="#a3adbd">Order of checks, per the sandbox-runtime README and source</text>

<rect x="28" y="84" width="400" height="64" rx="8" fill="#1a222d" stroke="#62b6ff"/>
<text x="44" y="112" font-size="15" font-weight="600" fill="#e6ebf2">allowNestedUserNamespaces: true</text>
<text x="44" y="134" font-size="13" fill="#a3adbd">set in the sandbox configuration</text>
<line x1="428" y1="116" x2="472" y2="116" stroke="#a3adbd" stroke-width="2"/>
<text x="436" y="108" font-size="12" fill="#a3adbd">yes</text>
<rect x="476" y="84" width="256" height="64" rx="8" fill="#1a222d" stroke="#ff5f56"/>
<text x="492" y="112" font-size="15" font-weight="600" fill="#ff5f56">No limit</text>
<text x="492" y="134" font-size="13" fill="#a3adbd">write denies can be undone</text>
<line x1="228" y1="148" x2="228" y2="184" stroke="#a3adbd" stroke-width="2"/>
<text x="236" y="172" font-size="12" fill="#a3adbd">no</text>

<rect x="28" y="184" width="400" height="64" rx="8" fill="#1a222d" stroke="#62b6ff"/>
<text x="44" y="212" font-size="15" font-weight="600" fill="#e6ebf2">Seccomp helper in the chain</text>
<text x="44" y="234" font-size="13" fill="#a3adbd">not with allowAllUnixSockets or an unsupported arch</text>
<line x1="428" y1="216" x2="472" y2="216" stroke="#a3adbd" stroke-width="2"/>
<text x="436" y="208" font-size="12" fill="#a3adbd">yes</text>
<rect x="476" y="184" width="256" height="64" rx="8" fill="#1a222d" stroke="#39e58c"/>
<text x="492" y="212" font-size="15" font-weight="600" fill="#39e58c">Seccomp filter + max 0</text>
<text x="492" y="234" font-size="13" fill="#a3adbd">unshare, mount, setns: EPERM</text>
<line x1="228" y1="248" x2="228" y2="284" stroke="#a3adbd" stroke-width="2"/>
<text x="236" y="272" font-size="12" fill="#a3adbd">no</text>

<rect x="28" y="284" width="400" height="80" rx="8" fill="#1a222d" stroke="#62b6ff"/>
<text x="44" y="312" font-size="15" font-weight="600" fill="#e6ebf2">bubblewrap 0.8.0+, not setuid,</text>
<text x="44" y="332" font-size="15" font-weight="600" fill="#e6ebf2">enableWeakerNestedSandbox off</text>
<text x="44" y="352" font-size="13" fill="#a3adbd">no seccomp helper available</text>
<line x1="428" y1="324" x2="472" y2="324" stroke="#a3adbd" stroke-width="2"/>
<text x="436" y="316" font-size="12" fill="#a3adbd">yes</text>
<rect x="476" y="292" width="256" height="64" rx="8" fill="#1a222d" stroke="#39e58c"/>
<text x="492" y="320" font-size="15" font-weight="600" fill="#39e58c">bwrap --disable-userns</text>
<text x="492" y="342" font-size="13" fill="#a3adbd">new user namespace: ENOSPC</text>
<line x1="228" y1="364" x2="228" y2="392" stroke="#a3adbd" stroke-width="2"/>
<text x="236" y="384" font-size="12" fill="#a3adbd">no</text>

<rect x="28" y="392" width="704" height="56" rx="8" fill="#1a222d" stroke="#ff5f56"/>
<text x="44" y="418" font-size="15" font-weight="600" fill="#ff5f56">No limit, one warning logged per process</text>
<text x="44" y="438" font-size="13" fill="#a3adbd">"a sandboxed command that creates one can undo the write denies"</text>
</g>
</svg>
