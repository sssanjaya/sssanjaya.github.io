<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="t d">
  <title id="t">Am I affected by CVE-2026-111770</title>
  <desc id="d">Decision flow. If the server is reached over HTTP, uses @modelcontextprotocol/server 2.0.0 through 2.2.0, and creates the McpServer or a stateless transport once at startup, it is affected. stdio servers, server 2.3.0 and later, and per-request or per-session wiring are not affected. The fix is to upgrade to 2.3.0 and build a server per request, per session, or through a createMcpHandler factory, because 2.3.0 rejects shared instances.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #e6ebf2; font-size: 15px; }
    .m { fill: #8b98a8; font-size: 14px; }
    .code { font-family: ui-monospace, monospace; font-size: 14px; }
    .q { fill: #131a23; stroke: #6cb6ff; stroke-width: 2; }
    .ok { fill: #131a23; stroke: #5fd38d; stroke-width: 2; }
    .bad { fill: #131a23; stroke: #ff6b6b; stroke-width: 2; }
    .fix { fill: #131a23; stroke: #f5b14c; stroke-width: 2; }
    .ln { stroke: #8b98a8; stroke-width: 2; fill: none; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b98a8"/></marker></defs>
  <rect width="900" height="500" fill="#0d1218"/>

  <rect class="q" x="40" y="30" width="300" height="56" rx="8"/>
  <text x="190" y="63" text-anchor="middle">Clients reach it over HTTP?</text>
  <rect class="q" x="40" y="140" width="300" height="70" rx="8"/>
  <text x="190" y="168" text-anchor="middle" class="code">@modelcontextprotocol/server</text>
  <text x="190" y="192" text-anchor="middle">2.0.0 to 2.2.0?</text>
  <rect class="q" x="40" y="264" width="300" height="70" rx="8"/>
  <text x="190" y="292" text-anchor="middle">McpServer or transport</text>
  <text x="190" y="316" text-anchor="middle">created once at startup?</text>
  <rect class="bad" x="40" y="390" width="300" height="70" rx="8"/>
  <text x="190" y="420" text-anchor="middle">Affected: responses can</text>
  <text x="190" y="443" text-anchor="middle">reach the wrong client</text>

  <line class="ln" x1="190" y1="86" x2="190" y2="136" marker-end="url(#a)"/><text x="200" y="117" class="m">yes</text>
  <line class="ln" x1="190" y1="210" x2="190" y2="260" marker-end="url(#a)"/><text x="200" y="241" class="m">yes</text>
  <line class="ln" x1="190" y1="334" x2="190" y2="386" marker-end="url(#a)"/><text x="200" y="365" class="m">yes</text>

  <rect class="ok" x="440" y="30" width="420" height="56" rx="8"/>
  <text x="650" y="54" text-anchor="middle">Outside this advisory</text>
  <text x="650" y="75" text-anchor="middle" class="m">stdio servers, or server 2.3.0 and later</text>
  <rect class="ok" x="440" y="264" width="420" height="70" rx="8"/>
  <text x="650" y="292" text-anchor="middle">Not affected: server built per request,</text>
  <text x="650" y="316" text-anchor="middle">per session, or by a factory</text>
  <line class="ln" x1="340" y1="58" x2="436" y2="58" marker-end="url(#a)"/><text x="372" y="50" class="m">no</text>
  <path class="ln" d="M340,175 L390,175 L390,66 L436,66" marker-end="url(#a)"/><text x="350" y="166" class="m">no</text>
  <line class="ln" x1="340" y1="299" x2="436" y2="299" marker-end="url(#a)"/><text x="372" y="291" class="m">no</text>

  <rect class="fix" x="440" y="378" width="420" height="94" rx="8"/>
  <text x="650" y="404" text-anchor="middle">Upgrade to 2.3.0 and change the wiring</text>
  <text x="650" y="428" text-anchor="middle" class="m">2.3.0 rejects a shared instance:</text>
  <text x="650" y="452" text-anchor="middle" class="code">connect() → ALREADY_CONNECTED</text>
  <line class="ln" x1="340" y1="425" x2="436" y2="425" marker-end="url(#a)"/>
</svg>
