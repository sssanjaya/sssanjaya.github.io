<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">Why the deny list never took effect</title>
  <desc id="d">Two lanes. In the root server lane, Vite compiles its deny matcher during config resolution, then Vitest pushes the token entry afterward, so the token is never matched. In the project server lane, a config hook returns deny set to just the token, which replaces Vite's default list, so .env is no longer denied.</desc>
  <rect width="900" height="540" fill="#0d1218"/>
  <text x="30" y="42" fill="#e6ebf2" font-size="23" font-weight="700">Two ways one deny list goes missing</text>
  <text x="30" y="68" fill="#8b98a8" font-size="14" font-family="ui-monospace, monospace">Vite applies default deny only if server.fs.deny is unset, and compiles it into a matcher once.</text>

  <!-- lane A: root server -->
  <rect x="30" y="92" width="840" height="190" rx="10" fill="#10161e" stroke="#2a3441"/>
  <text x="48" y="120" fill="#6cb6ff" font-size="16" font-weight="700">Root server (--ui / --api): entry added too late</text>

  <rect x="48" y="138" width="200" height="56" rx="6" fill="#141b24" stroke="#2a3441"/>
  <text x="148" y="162" fill="#e6ebf2" font-size="13" text-anchor="middle">Vite resolves config</text>
  <text x="148" y="181" fill="#5fd38d" font-size="12" text-anchor="middle">compiles deny matcher</text>

  <line x1="248" y1="166" x2="312" y2="166" stroke="#2a3441" stroke-width="2"/>
  <polygon points="312,166 302,161 302,171" fill="#2a3441"/>

  <rect x="316" y="138" width="230" height="56" rx="6" fill="#141b24" stroke="#f5b14c"/>
  <text x="431" y="162" fill="#e6ebf2" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">fs.deny.push(token)</text>
  <text x="431" y="181" fill="#f5b14c" font-size="12" text-anchor="middle">runs after compile</text>

  <line x1="546" y1="166" x2="610" y2="166" stroke="#2a3441" stroke-width="2"/>
  <polygon points="610,166 600,161 600,171" fill="#2a3441"/>

  <rect x="614" y="138" width="238" height="56" rx="6" fill="#241416" stroke="#ff6b6b"/>
  <text x="733" y="162" fill="#ff6b6b" font-size="14" text-anchor="middle" font-weight="700">token not in matcher</text>
  <text x="733" y="181" fill="#8b98a8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">GET token?raw = 200</text>

  <text x="48" y="232" fill="#8b98a8" font-size="13">Vite's defaults still protect .env and keys. The token file in node_modules/.vitest sits inside</text>
  <text x="48" y="252" fill="#8b98a8" font-size="13">fs.allow, so with no deny entry matching it, the server hands it out.</text>

  <!-- lane B: project server -->
  <rect x="30" y="298" width="840" height="206" rx="10" fill="#10161e" stroke="#2a3441"/>
  <text x="48" y="326" fill="#6cb6ff" font-size="16" font-weight="700">Project server (Browser Mode + test.projects): defaults replaced</text>

  <rect x="48" y="344" width="214" height="56" rx="6" fill="#141b24" stroke="#2a3441"/>
  <text x="155" y="368" fill="#e6ebf2" font-size="13" text-anchor="middle">config() hook returns</text>
  <text x="155" y="387" fill="#e6ebf2" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">deny: ['.vitest-secret-token']</text>

  <line x1="262" y1="372" x2="326" y2="372" stroke="#2a3441" stroke-width="2"/>
  <polygon points="326,372 316,367 316,377" fill="#2a3441"/>

  <rect x="330" y="344" width="216" height="56" rx="6" fill="#141b24" stroke="#f5b14c"/>
  <text x="438" y="368" fill="#e6ebf2" font-size="13" text-anchor="middle">array replaces, not</text>
  <text x="438" y="387" fill="#f5b14c" font-size="13" text-anchor="middle">merges, Vite defaults</text>

  <line x1="546" y1="372" x2="610" y2="372" stroke="#2a3441" stroke-width="2"/>
  <polygon points="610,372 600,367 600,377" fill="#2a3441"/>

  <rect x="614" y="344" width="238" height="56" rx="6" fill="#241416" stroke="#ff6b6b"/>
  <text x="733" y="368" fill="#ff6b6b" font-size="14" text-anchor="middle" font-weight="700">.env no longer denied</text>
  <text x="733" y="387" fill="#8b98a8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">served as text/javascript</text>

  <text x="48" y="438" fill="#8b98a8" font-size="13">The deny list now holds only the token. A malicious page can then load .env with a classic</text>
  <text x="48" y="458" fill="#8b98a8" font-size="13" font-family="ui-monospace, monospace">&lt;script src="http://localhost:PORT/.env"&gt;</text>
  <text x="48" y="482" fill="#8b98a8" font-size="13">and read each line whose value is valid JavaScript.</text>
</svg>
