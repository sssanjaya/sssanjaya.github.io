<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
<title id="t">When each curl attempt fires: default backoff versus fixed 1 second delay</title>
<desc id="d">Service opens its port at 40 seconds. With --retry 5 --retry-connrefused, attempts fire at 0, 1, 3, 7, 15 and 31 seconds and curl exits 7 at 31 seconds. With --retry 60 --retry-delay 1 --retry-max-time 60, curl tries every second and succeeds at 40.1 seconds.</desc>
<rect width="960" height="400" fill="#0d1218"/>
<style>@media (prefers-reduced-motion: no-preference){.cur{opacity:0.7;animation:sweep 8s linear infinite}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(860px)}}}</style>
