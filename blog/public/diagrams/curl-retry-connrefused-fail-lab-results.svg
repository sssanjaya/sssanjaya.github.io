<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 642" width="960" height="642" role="img" aria-labelledby="t d">
<title id="t">curl retry lab: seconds until curl exits, per scenario</title>
<desc id="d">Port opens at 5 s, --retry 5: 0.0 s, exit 7, gave up; Port opens at 5 s, --retry 5 --retry-connrefused: 7.0 s, exit 0, got ok; 404 for 5 s, --retry 5: 0.0 s, exit 0 on a 404 body; 404 for 5 s, --fail --retry 5 --retry-all-errors: 7.0 s, exit 0, got ok; 503 + Retry-After: 3 for 5 s, --retry 5: 6.0 s, exit 0, got ok; Port opens at 40 s, --retry 5 --retry-connrefused: 31.0 s, exit 7, gave up; Port opens at 40 s, --retry 60 --retry-connrefused --retry-delay 1 --retry-max-time 60: 40.1 s, exit 0, got ok.</desc>
