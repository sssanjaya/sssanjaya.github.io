<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" role="img" aria-labelledby="t d">
<title id="t">Minutes to build the same fitness app at each effort level</title>
<desc id="d">From the Spending your effort post on the Claude Code blog. Underspecified prompt: low 1.5, medium 4, high 11, max 67 minutes. Highly specified interview spec: low 16, medium 22, high 33, max 79 minutes. xhigh was not measured in this example.</desc>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:16px}.m{font-family:ui-sans-serif,system-ui,sans-serif;fill:#8b98a8;font-size:14px}.c{font-family:ui-monospace,monospace;fill:#e6ebf2;font-size:15px}</style>
<rect width="900" height="490" fill="#0d1218"/>
