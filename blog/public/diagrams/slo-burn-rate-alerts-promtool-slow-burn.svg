<line x1="80" y1="275.0" x2="790" y2="275.0" stroke="#f5b14c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="188.9" y="295.0" fill="#f5b14c" font-size="15" font-weight="600" text-anchor="start" >Burn rate 6 threshold: 0.6%</text>
