<text x="316.7" y="466" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="middle" >2 h</text>
<line x1="411.3" y1="440" x2="411.3" y2="446" stroke="#8b98a8" stroke-width="1"/>
