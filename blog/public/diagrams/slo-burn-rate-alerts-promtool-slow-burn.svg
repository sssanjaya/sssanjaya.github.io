<g font-family="ui-sans-serif, system-ui, sans-serif">
<text x="30" y="42" fill="#e6ebf2" font-size="21" font-weight="600" text-anchor="start" >The slow burn: 0.8% errors never reach a 1% threshold</text>
<text x="30" y="68" fill="#8b98a8" font-size="15" font-weight="400" text-anchor="start" >Recorded error ratio per window, sampled every 10 minutes from promtool 3.16.0</text>
