<text x="70" y="335.0" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >0.4%</text>
<line x1="80" y1="275.0" x2="790" y2="275.0" stroke="#2a3441" stroke-width="1"/>
<text x="70" y="280.0" fill="#8b98a8" font-size="14" font-weight="400" text-anchor="end" >0.6%</text>
