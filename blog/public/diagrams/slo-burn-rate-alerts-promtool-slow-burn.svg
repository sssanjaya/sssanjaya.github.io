<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-labelledby="t d">
<title id="t">Slow burn: error ratio by window against two alert thresholds</title>
<desc id="d">Line chart for 0.8% errors starting at hour 0. The 5-minute and 30-minute error ratios rise to 0.8% and stay under the 1% HighErrorRate threshold. The 6-hour error ratio climbs steadily and crosses the 0.6% burn-rate-6 threshold at 4 hours 30 minutes, when ErrorBudgetBurn pages.</desc>
