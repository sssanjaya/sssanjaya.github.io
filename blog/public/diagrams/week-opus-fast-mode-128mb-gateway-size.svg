<title id="t">Maximum Messages API request size by platform</title><desc id="d">Maximum Messages and Token Counting request size: first-party Claude API 128 MB since October 28, 2026, up from 32 MB. Claude Platform on AWS, Claude Models on Google Cloud (Anthropic managed) and Microsoft Foundry 32 MB. Claude Models on Google Cloud (Google managed) 30 MB. Amazon Bedrock 20 MB.</desc>
