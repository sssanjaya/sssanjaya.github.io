<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">git add . versus git add --resolved on the same conflicted merge</title>
  <desc id="d">One merge stopped with two conflicted files. main.py is resolved, app.conf still has conflict markers, notes.txt has an unrelated debug edit and debug.log is untracked. Left: git add . on Git 2.43.0 stages all four paths and git commit creates merge commit 9deb978 with the markers in app.conf. Right: git add --resolved on Git 2.56.1 exits 128 and names app.conf. After app.conf is fixed it stages only app.conf and main.py, and the merge commit has 2 files while notes.txt and debug.log stay out.</desc>
  <style>
    .t{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:16px}
    .h{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:18px;font-weight:600}
    .m{font-family:ui-sans-serif,system-ui,sans-serif;fill:#8b98a8;font-size:14px}
    .c{font-family:ui-monospace,monospace;fill:#e6ebf2;font-size:15px}
    .cr{font-family:ui-monospace,monospace;fill:#ff6b6b;font-size:15px}
    .cg{font-family:ui-monospace,monospace;fill:#5fd38d;font-size:15px}
    .ca{font-family:ui-monospace,monospace;fill:#f5b14c;font-size:15px}
    .bad{font-family:ui-sans-serif,system-ui,sans-serif;fill:#ff6b6b;font-size:16px;font-weight:600}
    .ok{font-family:ui-sans-serif,system-ui,sans-serif;fill:#5fd38d;font-size:16px;font-weight:600}
    @media (prefers-reduced-motion: no-preference){
      .pulse{animation:p 6s ease-in-out infinite}
      @keyframes p{0%,40%{opacity:1}55%{opacity:.35}70%,100%{opacity:1}}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8b98a8"/></marker>
  </defs>
  <rect width="960" height="600" fill="#0d1218"/>
  <!-- shared start -->
  <rect x="250" y="20" width="460" height="150" rx="10" fill="none" stroke="#2a3441" stroke-width="2"/>
  <text class="h" x="270" y="48">Merge stopped: git status --short</text>
  <text class="cr" x="270" y="78">UU app.conf</text><text class="m" x="430" y="78">markers still in file</text>
  <text class="ca" x="270" y="102">UU main.py</text><text class="m" x="430" y="102">resolved, not staged</text>
  <text class="c" x="270" y="126"> M notes.txt</text><text class="m" x="430" y="126">unrelated debug edit</text>
  <text class="c" x="270" y="150">?? debug.log</text><text class="m" x="430" y="150">untracked</text>
  <path d="M370,172 L240,222" stroke="#8b98a8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M590,172 L720,222" stroke="#8b98a8" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <!-- left -->
  <rect x="20" y="230" width="440" height="350" rx="10" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text class="h" x="40" y="262">Before: git add . (Git 2.43.0)</text>
  <text class="c" x="40" y="296">M  app.conf</text><text class="bad" x="200" y="296">markers staged</text>
  <text class="c" x="40" y="320">M  main.py</text>
  <text class="c" x="40" y="344">M  notes.txt</text><text class="bad" x="200" y="344">debug edit staged</text>
  <text class="c" x="40" y="368">A  debug.log</text><text class="bad" x="200" y="368">log file staged</text>
  <line x1="40" y1="388" x2="440" y2="388" stroke="#2a3441" stroke-width="2"/>
  <text class="c" x="40" y="418">$ git commit --no-edit</text>
  <text class="c" x="40" y="442">[main 9deb978] Merge branch 'feature'</text>
  <text class="c" x="40" y="466"> 4 files changed</text>
  <text class="cr pulse" x="40" y="500">HEAD:app.conf:1:&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text class="cr pulse" x="40" y="524">HEAD:app.conf:5:&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>
  <text class="m" x="40" y="558">No error. The markers are now in history.</text>
  <!-- right -->
  <rect x="500" y="230" width="440" height="350" rx="10" fill="none" stroke="#5fd38d" stroke-width="2"/>
  <text class="h" x="520" y="262">After: git add --resolved (2.56.1)</text>
  <text class="cr" x="520" y="296">fatal: the following paths still</text>
  <text class="cr" x="520" y="320">have conflict markers:</text>
  <text class="cr" x="520" y="344">        app.conf</text>
  <text class="ok" x="520" y="372">exit 128, index unchanged</text>
  <line x1="520" y1="388" x2="920" y2="388" stroke="#2a3441" stroke-width="2"/>
  <text class="m" x="520" y="414">fix app.conf, run it again:</text>
  <text class="cg" x="520" y="440">M  app.conf</text>
  <text class="cg" x="520" y="464">M  main.py</text>
  <text class="c" x="520" y="488"> M notes.txt</text><text class="m" x="680" y="488">left alone</text>
  <text class="c" x="520" y="512">?? debug.log</text><text class="m" x="680" y="512">left alone</text>
  <text class="ok" x="520" y="550">Merge commit: 2 files changed</text>
</svg>
