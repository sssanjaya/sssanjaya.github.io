<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
<title id="t">Claude Security finding lifecycle with continuous scanning</title>
<desc id="d">Connect repositories to a project, Claude runs a deep baseline scan, then scans changes based on risk and complexity. A finding opens with a severity judged against the project threat model. When a fix lands, in Claude Code or elsewhere, the finding is marked fixed. If the issue is found again, the finding reopens automatically. API and webhooks report new findings.</desc>
<style>
.t{fill:#e6ebf2;font-size:17px}.m{fill:#8b98a8;font-size:15px}.h{font-size:19px;font-weight:700;fill:#e6ebf2}
@media (prefers-reduced-motion: no-preference){.s{animation:hl 8s infinite}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}
@keyframes hl{0%,20%{stroke:#6cb6ff;stroke-width:4}25%,100%{stroke-width:2}}}
</style>
<rect fill="#0d1218" width="900" height="440"/>
<text x="30" y="40" class="h">Claude Security: from one-off scan to tracked findings</text>
<rect class="s" x="30" y="70" width="190" height="90" rx="8" fill="#121a23" stroke="#2a3441" stroke-width="2"/>
<text x="46" y="100" class="t">Project</text><text x="46" y="124" class="m">repos, branch, scope,</text><text x="46" y="145" class="m">knowledge base</text>
<path d="M220 115 H 250" stroke="#6cb6ff" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="s s2" x="255" y="70" width="190" height="90" rx="8" fill="#121a23" stroke="#2a3441" stroke-width="2"/>
<text x="271" y="100" class="t">Deep baseline</text><text x="271" y="124" class="m">scan, plus a threat</text><text x="271" y="145" class="m">model you can edit</text>
<path d="M445 115 H 475" stroke="#6cb6ff" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="s s3" x="480" y="70" width="190" height="90" rx="8" fill="#121a23" stroke="#2a3441" stroke-width="2"/>
<text x="496" y="100" class="t">Change scans</text><text x="496" y="124" class="m">regularly, by risk</text><text x="496" y="145" class="m">and complexity</text>
<path d="M670 115 H 700" stroke="#6cb6ff" stroke-width="2.5" marker-end="url(#a)"/>
<rect class="s s4" x="705" y="70" width="170" height="90" rx="8" fill="#2c1416" stroke="#ff6b6b" stroke-width="2"/>
<text x="721" y="100" class="t">Finding open</text><text x="721" y="124" class="m">severity and</text><text x="721" y="145" class="m">attack path</text>
<path d="M790 160 V 240" stroke="#6cb6ff" stroke-width="2.5" marker-end="url(#a)"/>
<text x="600" y="205" class="m">fix lands anywhere</text>
<rect x="705" y="245" width="170" height="70" rx="8" fill="#0f2a1c" stroke="#5fd38d" stroke-width="2"/>
<text x="721" y="276" class="t">Marked fixed</text><text x="721" y="299" class="m">automatically</text>
<path d="M705 280 H 520 V 165" stroke="#f5b14c" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#b)"/>
<text x="535" y="270" class="m" style="fill:#f5b14c">found again:</text>
<text x="535" y="292" class="m" style="fill:#f5b14c">reopens on its own</text>
<rect x="30" y="245" width="400" height="70" rx="8" fill="#121a23" stroke="#2a3441" stroke-width="2"/>
<text x="46" y="275" class="t">Out to your tools</text><text x="46" y="299" class="m">API, webhooks on new findings, MCP connector</text>
<text x="30" y="365" class="m">Public beta for Claude Enterprise. $25,000 in free usage credits a month for two months,</text>
<text x="30" y="388" class="m">for usage through December 31, 2026.</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6cb6ff"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5b14c"/></marker></defs>
</svg>
