<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 704" width="960" height="704" role="img" aria-labelledby="t d">
<title id="t">Twelve lab runs on Claude Code 2.1.314</title>
<desc id="d">Results of twelve claude -p runs in acceptEdits mode. With blockWritesOutsideWorkingDirectories on, Write and Edit to an outside path were refused even with an Edit allow rule, including through a symlink and when the setting came from the repository file; --add-dir lifted it. Bash redirects with an Edit allow rule still wrote outside, with and without the sandbox. Without the Edit allow rule, the redirect needed approval and the sandbox returned Read-only file system.</desc>
<rect width="960" height="704" fill="#0d1218"/>
<style>.t{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:15px}.m{font-family:ui-sans-serif,system-ui,sans-serif;fill:#8b98a8;font-size:14px}.c{font-family:ui-monospace,monospace;fill:#e6ebf2;font-size:15px}.h{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e6ebf2;font-size:18px;font-weight:700}</style>
