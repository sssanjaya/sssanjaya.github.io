<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">Which Vitest 5 server serves which file</title>
  <desc id="d">A table of three Vitest setups. Plain vitest run opens no server. The root server (--ui or api) denies .env but serves the API token file. Browser Mode with test.projects serves .env from its project server but denies the token. The two served cells are the leaks.</desc>
  <rect width="900" height="560" fill="#0d1218"/>
  <text x="30" y="44" fill="#e6ebf2" font-size="24" font-weight="700">Vitest 5.0.0-beta.6 to 5.0.4: what each dev server serves</text>
  <text x="30" y="70" fill="#8b98a8" font-size="15">A client that can reach the server sends plain HTTP GETs. Red = served to the caller.</text>

  <!-- column headers -->
  <text x="34" y="118" fill="#8b98a8" font-size="14" font-family="ui-monospace, monospace">setup</text>
  <rect x="330" y="96" width="260" height="34" rx="6" fill="#141b24" stroke="#2a3441"/>
  <text x="460" y="118" fill="#e6ebf2" font-size="14" text-anchor="middle">Vite default deny</text>
  <text x="460" y="134" fill="#8b98a8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">.env  keys  .git</text>
  <rect x="604" y="96" width="266" height="34" rx="6" fill="#141b24" stroke="#2a3441"/>
  <text x="737" y="118" fill="#e6ebf2" font-size="14" text-anchor="middle">API token file</text>
  <text x="737" y="134" fill="#8b98a8" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">.vitest-secret-token</text>

  <!-- row 1: plain -->
  <rect x="30" y="156" width="840" height="100" rx="8" fill="#10161e" stroke="#2a3441"/>
  <text x="48" y="196" fill="#e6ebf2" font-size="16" font-family="ui-monospace, monospace">vitest / vitest run</text>
  <text x="48" y="222" fill="#8b98a8" font-size="13">no HTTP server, nothing listens</text>
  <rect x="330" y="176" width="260" height="60" rx="6" fill="#161d26" stroke="#2a3441"/>
  <text x="460" y="212" fill="#8b98a8" font-size="15" text-anchor="middle">not reachable</text>
  <rect x="604" y="176" width="266" height="60" rx="6" fill="#161d26" stroke="#2a3441"/>
  <text x="737" y="212" fill="#8b98a8" font-size="15" text-anchor="middle">not reachable</text>

  <!-- row 2: root server -->
  <rect x="30" y="266" width="840" height="100" rx="8" fill="#10161e" stroke="#2a3441"/>
  <text x="48" y="306" fill="#e6ebf2" font-size="16" font-family="ui-monospace, monospace">--ui  or  --api</text>
  <text x="48" y="332" fill="#8b98a8" font-size="13">root server listens</text>
  <rect x="330" y="286" width="260" height="60" rx="6" fill="#132018" stroke="#5fd38d"/>
  <text x="460" y="314" fill="#5fd38d" font-size="15" text-anchor="middle" font-weight="700">denied</text>
  <text x="460" y="334" fill="#8b98a8" font-size="12" text-anchor="middle">403</text>
  <rect x="604" y="286" width="266" height="60" rx="6" fill="#241416" stroke="#ff6b6b"/>
  <text x="737" y="314" fill="#ff6b6b" font-size="15" text-anchor="middle" font-weight="700">served  200</text>
  <text x="737" y="334" fill="#8b98a8" font-size="12" text-anchor="middle">fallback location only</text>

  <!-- row 3: browser projects -->
  <rect x="30" y="376" width="840" height="100" rx="8" fill="#10161e" stroke="#2a3441"/>
  <text x="48" y="414" fill="#e6ebf2" font-size="16" font-family="ui-monospace, monospace">Browser Mode</text>
  <text x="48" y="436" fill="#8b98a8" font-size="13">with test.projects: each</text>
  <text x="48" y="454" fill="#8b98a8" font-size="13">project server listens</text>
  <rect x="330" y="396" width="260" height="60" rx="6" fill="#241416" stroke="#ff6b6b"/>
  <text x="460" y="424" fill="#ff6b6b" font-size="15" text-anchor="middle" font-weight="700">served</text>
  <text x="460" y="444" fill="#8b98a8" font-size="12" text-anchor="middle">GET /.env?raw returns it</text>
  <rect x="604" y="396" width="266" height="60" rx="6" fill="#132018" stroke="#5fd38d"/>
  <text x="737" y="424" fill="#5fd38d" font-size="15" text-anchor="middle" font-weight="700">denied</text>

  <text x="30" y="512" fill="#e6ebf2" font-size="15" font-weight="700">Two leaks, two causes:</text>
  <text x="30" y="534" fill="#8b98a8" font-size="14">the root server adds the token to the deny list too late; the project server replaces the deny list entirely.</text>
</svg>
