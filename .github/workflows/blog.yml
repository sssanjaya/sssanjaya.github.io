# Build the blog (blog/) and deploy it to Cloudflare Pages with Wrangler at
# blog.sanjayhona.com.np. The main site deploys separately (static.yml).
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token scoped to Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
# Without them the job still builds the blog, then skips the deploy.
name: Deploy blog

on:
  push:
    branches: ["main"]
    paths:
      - "blog/**"
      - "src/components/**"
      - "src/data/**"
      - "src/layouts/**"
      - "src/lib/**"
      - "src/scripts/**"
      - "src/styles/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blog.yml"
  # Daily rebuild so scheduled posts (future `date`) go live on their day,
  # at the first 11:00 UTC run on or after their date and time.
  # 11:00 UTC is 7:00 in Ottawa (6:00 in winter). GitHub disables scheduled
  # workflows after 60 days without repo activity; re-enable in Actions.
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog
  cancel-in-progress: false

env:
  PROJECT: sanjayhona-blog

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: blog
      url: https://blog.sanjayhona.com.np
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build:blog
      # On the daily schedule, deploy only when the build publishes a
      # different set of posts than the live feed: a post whose date has
      # passed, including one missed by an earlier failed run or dated with
      # a later time of day. Pushes and manual runs always deploy.
      - name: Check for newly due posts
        id: due
        env:
          FEED: https://blog.sanjayhona.com.np/rss.xml
        run: |
          set -o pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          links() { grep -o '<link>[^<]*</link>' | sort; }
          built=$(links < blog/dist/rss.xml)
          if ! live=$(curl -fsS --retry 3 "$FEED" | links); then
            echo "::warning::Could not fetch $FEED. Deploying to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$built" != "$live" ]; then
            echo "Post list changed:"; diff <(echo "$live") <(echo "$built") || true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No newly due posts. Nothing to publish."
          fi
      - name: Check Cloudflare credentials
        if: steps.due.outputs.run == 'true'
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Built the blog, skipped the deploy."
          fi
      # Wrangler runs straight from npm at a pinned version: no third-party
      # action in the path, and the version is explicit and reviewable.
      - name: Deploy to Cloudflare Pages
        if: steps.due.outputs.run == 'true' && steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER: wrangler@4.136.3
        run: |
          if npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT"; then
            echo "Pages project $PROJECT exists."
          else
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch=main
          fi
          npx --yes "$WRANGLER" pages deploy blog/dist --project-name="$PROJECT" --branch=main --commit-dirty=true
