# Build the blog (blog/) and deploy it to Cloudflare Pages at
# blog.sanjayhona.com.np. The main site deploys separately (static.yml).
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token scoped to Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard sidebar
# Without them the job still builds the blog, then skips the deploy.
name: Deploy blog

on:
  push:
    branches: ["main"]
    paths:
      - "blog/**"
      - "src/components/**"
      - "src/data/**"
      - "src/layouts/**"
      - "src/lib/**"
      - "src/scripts/**"
      - "src/styles/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog
  cancel-in-progress: false

env:
  PROJECT: sanjayhona-blog

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: blog
      url: https://blog.sanjayhona.com.np
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build:blog
      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Built the blog, skipped the deploy."
          fi
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@1fe0517c9eb0b72d7f3cb0aba71a3d7719487ea6 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          # Creates the Pages project on first run; "already exists" after that is fine.
          preCommands: npx wrangler pages project create ${{ env.PROJECT }} --production-branch=main || true
          command: pages deploy blog/dist --project-name=${{ env.PROJECT }} --branch=main
