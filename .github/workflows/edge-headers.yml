# Apply the main site's edge security config (GitHub Pages can't set headers):
# a Response Header Transform Rule (infra/cloudflare/security-headers.mjs) and
# preload-eligible HSTS for the zone (infra/cloudflare/hsts.mjs).
#
# Token: CLOUDFLARE_ZONE_TOKEN if set, else CLOUDFLARE_API_TOKEN. Either needs
# Zone > Zone > Read, Zone > Transform Rules > Edit, and Zone > Zone Settings >
# Edit on sanjayhona.com.np.
name: Edge headers

on:
  push:
    branches: ["main"]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/edge-headers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-headers
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Neither CLOUDFLARE_ZONE_TOKEN nor CLOUDFLARE_API_TOKEN is set. Skipped applying edge headers."
          fi
      - name: Apply header rule
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: sanjayhona.com.np
        run: node infra/cloudflare/security-headers.mjs
      - name: Apply HSTS
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_ZONE_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: sanjayhona.com.np
        run: node infra/cloudflare/hsts.mjs
      - name: Verify live headers
        if: steps.cf.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            h=$(curl -sSI "https://sanjayhona.com.np/?edge=$RANDOM" | tr -d '\r')
            if echo "$h" | grep -qi '^x-frame-options: DENY' && echo "$h" | grep -qi "^content-security-policy: frame-ancestors 'none'" && echo "$h" | grep -qi '^permissions-policy:'; then
              echo "$h" | grep -iE '^(x-frame-options|content-security-policy|permissions-policy|referrer-policy|x-content-type-options):'
              exit 0
            fi
            sleep 10
          done
          echo "::error::Headers not visible on https://sanjayhona.com.np after 2 minutes"
          echo "$h"
          exit 1
      - name: Verify HSTS preload eligibility
        if: steps.cf.outputs.ready == 'true'
        run: |
          for i in $(seq 1 12); do
            hsts=$(curl -sSI "https://sanjayhona.com.np/?hsts=$RANDOM" | tr -d '\r' | grep -i '^strict-transport-security:' || true)
            if echo "$hsts" | grep -q 'max-age=31536000'; then
              echo "$hsts"
              # A failed API call counts as "not yet" and retries, not a hard fail.
              errors=$(curl -fsS "https://hstspreload.org/api/v2/preloadable?domain=sanjayhona.com.np" | python3 -c "import sys,json; print(len(json.load(sys.stdin)['errors']))") || errors="unknown (API call failed)"
              echo "hstspreload.org errors: $errors"
              [ "$errors" = 0 ] && exit 0
            fi
            sleep 10
          done
          echo "::error::HSTS not preload-eligible after 2 minutes: ${hsts:-no header}"
          exit 1
