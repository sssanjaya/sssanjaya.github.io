# Build the Astro site and deploy it to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["main"]
    # The blog deploys on its own (blog.yml); a commit that only touches
    # blog/ doesn't change this site.
    paths-ignore:
      - "blog/**"
  workflow_dispatch:

# Read-only by default; each job asks for exactly what it needs below.
permissions:
  contents: read

# Allow one concurrent deployment; let in-progress production runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Actions are pinned to full commit SHAs (tags can be moved). Dependabot
# keeps the SHAs and their version comments current via .github/dependabot.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site config
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # No dependency lifecycle scripts: none are needed to build (esbuild
      # ships its binary as an optional dependency), and it shrinks what a
      # compromised package could run here.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # v4+ skips dotfiles by default; set include-hidden-files: true if
      # public/ ever gains one (e.g. .well-known/security.txt).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
