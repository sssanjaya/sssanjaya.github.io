# Version updates. Security updates are enabled separately in repo settings
# and still open their own PRs immediately.
version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # One grouped PR a month for minor/patch npm updates; majors come alone.
  # Security fixes arrive together in one PR. .github/workflows/pr.yml
  # merges non-major Dependabot PRs once the site and blog build.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
